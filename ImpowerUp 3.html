function advancePomodoroPhase(session){
  beep(session.phases[session.phaseIndex].type==="work" ? 440 : 660, 0.4, 0.25);
  session.phaseIndex++;
  const next = session.phases[session.phaseIndex];
  if(!next){
    if(focusTimer) clearInterval(focusTimer);
    toast("Pomodoro complete! Tap Finish Now.");
    saveState();
    render();
    return;
  }
  session.phaseStartTime = new Date().toISOString();
  session.lastCheckinMsg = next.type==="work" ? "Break's over — let's get back to it." : (next.long ? "Great push! Take a longer breather." : "Nice work! Short break time.");
  saveState();
  render();
}

function fmtMinutesDuration(mins){
  mins = Math.max(0, Math.round(mins||0));
  const h = Math.floor(mins/60), m = mins%60;
  if(h && m) return h+"h "+m+"m";
  if(h) return h+"h";
  return m+"m";

function bedtimeTargetDate(){
  const bt = state.profile.bedtime||"22:00";
  const [bh,bm] = bt.split(":").map(Number);
  const now = new Date();
  let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), bh||22, bm||0, 0, 0);
  if(target.getTime() <= now.getTime()) target = new Date(target.getTime() + 24*60*60*1000);
  return target;

let tasksCountdownTimer = null;
function startTasksCountdownTicker(){
  if(tasksCountdownTimer) clearInterval(tasksCountdownTimer);
  function tick(){
    const el = document.getElementById("bedtimeCountdown");
    if(!el){ clearInterval(tasksCountdownTimer); tasksCountdownTimer=null; return; }
    const remainMs = bedtimeTargetDate().getTime() - Date.now();
    el.textContent = fmtMinutesDuration(remainMs/60000);
    const totalPending = pendingTasksTotalMinutes();
    const fitEl = document.getElementById("bedtimeFitNote");
    if(fitEl){
      if(totalPending<=0){ fitEl.textContent = ""; }
      else if(totalPending*60000 <= remainMs){ fitEl.textContent = "✅ You have time for everything on your list."; fitEl.style.color = "var(--accent2)"; }
      else { fitEl.textContent = "⚠️ Your pending tasks ("+fmtMinutesDuration(totalPending)+") won't all fit before bedtime."; fitEl.style.color = "var(--danger)"; }
    }
  }
  tick();
  tasksCountdownTimer = setInterval(tick, 15000);
}

function checkInDueDates(daysBack){
  // Which of the last N days should have had a check-in, per the reminder-frequency setting.
  const freq = state.profile.checkInFrequency || "daily";
  const custom = state.profile.checkInCustomDays || [];
  const out = [];
  for(let i=daysBack-1;i>=0;i--){
    const d = addDays(todayStr(), -i);

    let due = false;
    if(freq==="daily") due = true;
    else if(freq==="3x_week") due = ["Mon","Wed","Fri"].includes(dow);

    out.push({date:d, due});
  }
  return out;
}

function lerpNum(a,b,t){ return a+(b-a)*t; }
function mixWithWhite(rgb, amt){ return rgb.map(c=>Math.round(c + (255-c)*amt)); }
// Heatmap color range: fixed solemn red at the low end (0 = tough/negative day),
// brightening into the user's current theme accent color at the high end (1 = positive day).
function heatmapColorRange(){
  const solemnRed = hexToRgb("#B91C1C");
  const positiveHex = (state.profile && state.profile.accent2) || currentTheme().accent2 || "#14B8A6";
  return {from: solemnRed, to: hexToRgb(positiveHex)};
}
function heatmapColorForScore(score){
  if(score==null) return null;
  const range = heatmapColorRange();
  let rgb = [0,1,2].map(i=>Math.round(lerpNum(range.from[i], range.to[i], score)));
  rgb = mixWithWhite(rgb, score*0.3); // brighter/lighter as the day trends more positive
  return 'rgb('+rgb.join(',')+')';
}
// Combines that day's logged mood (from a check-in) with habit-completion volume into one
// 0 (solemn/low) .. 1 (bright/positive) score. Returns null when nothing was logged that day.
function dayPositivityScore(d, counts, maxCount){
  const ci = checkInForDate(d);
  const moodScore = (ci && ci.mood) ? (moodValueNum(ci.mood)-1)/3 : null;
  const count = counts[d]||0;
  const completionScore = maxCount>0 ? Math.min(1, count/maxCount) : 0;
  if(moodScore!=null && count>0) return moodScore*0.65 + completionScore*0.35;
  if(moodScore!=null) return moodScore;
  if(count>0) return completionScore;
  return null;
}

  const gridStart = addDays(gridEnd, -(totalDays-1));
  const counts = {};
  (state.habitLogs||[]).forEach(l=>{ counts[l.completed_date] = (counts[l.completed_date]||0)+1; });
  const max = Math.max(1, ...Object.values(counts));
  const today = todayStr();
  let cols = "";
  for(let col=0; col<weeksBack; col++){
    let rows = "";
    for(let row=0; row<7; row++){
      const d = addDays(gridStart, col*7+row);
      const future = d>today;
      const c = counts[d]||0;
      const score = future ? null : dayPositivityScore(d, counts, max);
      const color = heatmapColorForScore(score);
      const ci = checkInForDate(d);
      const mood = ci && ci.mood ? (MOODS.find(m=>m.v===ci.mood)||{}).l : null;
      const titleBits = [fmtDatePretty(d)];
      if(!future){ if(c) titleBits.push(c+' completion'+(c===1?'':'s')); if(mood) titleBits.push('Mood: '+mood); if(!c && !mood) titleBits.push('No data logged'); }
      rows += '<div title="'+titleBits.join(' · ')+'" style="width:11px;height:11px;border-radius:3px;'+
        (future ? 'visibility:hidden;' : (color ? 'background:'+color+';border:1px solid rgba(0,0,0,0.08);' : 'background:var(--surface-2);border:1px solid var(--border);'))+
        '"></div>';
    }
    cols += '<div style="display:flex;flex-direction:column;gap:3px;">'+rows+'</div>';
  }
  const legendRange = heatmapColorRange();
  const legendCss = 'linear-gradient(90deg, rgb('+legendRange.from.join(',')+'), '+heatmapColorForScore(1)+')';
  return '<div style="display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;">'+cols+'</div>'+
    '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;">'+
    '<div style="width:70px;height:9px;border-radius:5px;background:'+legendCss+';flex-shrink:0;"></div>'+
    '<div class="hc-meta">🔴 Tougher/solemn days → brighter '+escapeHtml(currentTheme().label)+'-tinted days for your best ones · ⬜ No data logged</div>'+
    '</div>'+
    '<div class="hc-meta" style="margin-top:4px;">Colors blend your logged mood and habit completions for each day — the bright end follows your Settings → Aesthetic theme color.</div>';
}
function successMatrixHtml(){
  const last30 = [];
  for(let i=29;i>=0;i--) last30.push(addDays(todayStr(),-i));
  const checkedInDays = last30.filter(d=>checkInForDate(d)).length;
  const checkInPct = Math.round((checkedInDays/30)*100);
  const habitCompletionsOnCheckinDays = last30.filter(d=>checkInForDate(d)).reduce((sum,d)=>sum+(state.habitLogs||[]).filter(l=>l.completed_date===d).length,0);
  const habitCompletionsOnOtherDays = last30.filter(d=>!checkInForDate(d)).reduce((sum,d)=>sum+(state.habitLogs||[]).filter(l=>l.completed_date===d).length,0);
  const daysWithCheckin = checkedInDays||1;
  const daysWithout = (30-checkedInDays)||1;
  const avgOnCheckin = (habitCompletionsOnCheckinDays/daysWithCheckin).toFixed(1);
  const avgOnOther = (habitCompletionsOnOtherDays/daysWithout).toFixed(1);
  const avgMood = ins=>{ const withMood = ins.filter(c=>c.mood); if(!withMood.length) return null; return (withMood.reduce((s,c)=>s+moodValueNum(c.mood),0)/withMood.length).toFixed(1); };
  const recentIns = (state.checkIns||[]).filter(c=>last30.includes(c.date));
  const moodAvg = avgMood(recentIns);
  return '<div class="grid cols-3">'+stat(checkInPct+"%","Check-in rate (30d)")+stat(checkInStreakDays(),"Day streak")+stat(moodAvg?moodAvg+"/4":"—","Avg mood")+'</div>'+
    '<p class="hc-meta" style="margin-top:10px;">On days you check in, you complete <b>'+avgOnCheckin+'</b> habits on average, vs <b>'+avgOnOther+'</b> on days you don\'t'+(Number(avgOnCheckin)>Number(avgOnOther)?' — checking in seems to help! 🎉':'')+'.</p>';
}
function habitGoalTimelineHtml(){
  const events = [];
  (state.habitLogs||[]).forEach(l=>{
    const h = (state.habits||[]).find(x=>x.id===l.habit_id);
    if(h) events.push({date:l.completed_date, icon:h.emoji||"✅", label:h.title+" completed", color:h.color});
  });
  (state.goals||[]).forEach(g=>{
    if(g.target_date) events.push({date:g.target_date, icon:g.emoji||"🎯", label:(g.status==="completed"?"Goal completed: ":"Goal target: ")+g.title, color:g.color});
  });
  (state.checkIns||[]).forEach(c=>{
    const mood = MOODS.find(m=>m.v===c.mood);
    events.push({date:c.date, icon: mood?mood.e:"📝", label:"Check-in logged"+(mood?" · "+mood.l:""), color:null});
  });
  events.sort((a,b)=>b.date.localeCompare(a.date));
  const recent = events.slice(0,25);
  if(!recent.length) return '<p class="hc-meta">Nothing logged yet — complete a habit or log a check-in to see your timeline.</p>';
  return recent.map(e=>'<div class="timeline-item"><div class="timeline-time">'+fmtDatePretty(e.date).slice(0,6)+'</div>'+
    '<div class="timeline-line"><div class="timeline-dot" style="background:'+(e.color||"var(--accent)")+';"></div></div>'+
    '<div class="timeline-content">'+e.icon+' '+escapeHtml(e.label)+'</div></div>').join("");
}

function generateShareSnapshot(){
  const lvl = levelFromXp(totalPoints());
  return {
    name: displayName(),
    level: lvl.level, levelTitle: lvl.title, totalPoints: totalPoints(),
    bestStreak: bestActiveStreak(),
    badges: computeEarnedBadges().map(b=>({emoji:b.emoji, title:b.title})),
    habits: state.habits.filter(h=>h.is_active!==false).map(h=>{ const s=computeStreaks(h); return {title:h.title, emoji:h.emoji, currentStreak:s.current, bestStreak:s.best}; }),
    goals: state.goals.filter(g=>g.status!=="completed").map(g=>({title:g.title, emoji:g.emoji, progress:g.progress||0})),
    proofCount: state.habitLogs.filter(l=>l.proof_photo_url).length + state.goals.filter(g=>g.proof_photo_url).length,
    messages: (state.mentorMessages||[]).map(m=>({id:m.id, sender:m.sender, text:m.text, at:m.at})),
    generatedAt: new Date().toISOString()
  };
}

/* ============ ICS export ============ */
function icsEscape(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function exportICS(){
  const now = new Date();
  const dtstamp = now.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const dayMap = {Sun:"SU",Mon:"MO",Tue:"TU",Wed:"WE",Thu:"TH",Fri:"FR",Sat:"SA"};
  let lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ImpowerUp//EN","CALSCALE:GREGORIAN"];
  state.reminders.filter(r=>r.is_active!==false).forEach(r=>{
    const [hh,mm] = (r.time||"09:00").split(":");
    const byday = (r.days||[]).map(d=>dayMap[d]).filter(Boolean).join(",");
    const startDate = todayStr().replace(/-/g,"");
    lines.push("BEGIN:VEVENT");
    lines.push("UID:"+r.id+"@impowerup");
    lines.push("DTSTAMP:"+dtstamp);
    lines.push("DTSTART:"+startDate+"T"+hh.padStart(2,"0")+mm.padStart(2,"0")+"00");
    lines.push("DURATION:PT15M");
    if(byday) lines.push("RRULE:FREQ=WEEKLY;BYDAY="+byday);
    lines.push("SUMMARY:"+icsEscape(r.title));
    if(r.message) lines.push("DESCRIPTION:"+icsEscape(r.message));
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], {type:"text/calendar"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="impowerup-reminders.ics"; a.click();
  URL.revokeObjectURL(url);
}

/* ============ Photo proof capture ============ */
window._proofTarget = null;
function fileToCompressedDataUrl(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1,Math.round(img.width*scale));
        canvas.height = Math.max(1,Math.round(img.height*scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality||0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function beep(freq, duration, gainVal){

function hornBlast(gainVal){

function tone(freq, type, startAt, dur, peakGain){

/* A short white-noise burst, used to add rasp/texture under other sounds. */
function noiseBurst(startAt, dur, peakGain, filterFreq){

  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);

  for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(peakGain||0.3, now+0.04);
  gain.gain.linearRampToValueAtTime(0.0001, now+(dur||0.3));
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start(now); noise.stop(now+(dur||0.3)+0.02);

/* A shrieking, pitch-swooping shout — as close to a scream as oscillators get. */
function scream(gainVal){
  const ctx = window._audioCtx; if(!ctx) return;
  const now = ctx.currentTime;
  const g = gainVal||0.5;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(600, now);
  osc.frequency.exponentialRampToValueAtTime(1900, now+0.15);
  osc.frequency.exponentialRampToValueAtTime(850, now+0.32);
  osc.frequency.exponentialRampToValueAtTime(2200, now+0.5);
  osc.frequency.exponentialRampToValueAtTime(700, now+0.78);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(g, now+0.04);
  gain.gain.linearRampToValueAtTime(g*0.75, now+0.4);
  gain.gain.linearRampToValueAtTime(0.0001, now+0.85);
  osc.connect(gain); gain.connect(ctx.destination);

  noiseBurst(0.02, 0.8, g*0.35, 1800);

/* A distorted power-chord "chug" — heavy-metal riff stab. */
function distortionCurve(amount){
  const k = amount||400, n = 4096, curve = new Float32Array(n), deg = Math.PI/180;
  for(let i=0;i<n;i++){ const x = i*2/n-1; curve[i] = (3+k)*x*20*deg / (Math.PI+k*Math.abs(x)); }
  return curve;
}
function metalChord(gainVal){
  const ctx = window._audioCtx; if(!ctx) return;
  const now = ctx.currentTime;
  const g = gainVal||0.5;
  const shaper = ctx.createWaveShaper(); shaper.curve = distortionCurve(400); shaper.oversample = "4x";
  const master = ctx.createGain(); master.gain.value = g;
  shaper.connect(master); master.connect(ctx.destination);
  const rootFreq = 82.41; // low E
  const chordFreqs = [rootFreq, rootFreq*1.5, rootFreq*2]; // power chord: root, fifth, octave
  [0, 0.12, 0.24, 0.4].forEach(function(t){
    chordFreqs.forEach(function(f){
      const osc = ctx.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = f;
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.0001, now+t);
      og.gain.linearRampToValueAtTime(1, now+t+0.01);
      og.gain.exponentialRampToValueAtTime(0.0001, now+t+0.11);
      osc.connect(og); og.connect(shaper);
      osc.start(now+t); osc.stop(now+t+0.13);
    });
  });
}

function startAlarmSound(level){

  const vol = Math.max(0, Math.min(1, volPct/100));
  const levelScale = {gentle:0.55, moderate:0.8, loud:1, persistent:1.15}[level] || 0.8;
  const gainVal = vol * levelScale;

  if(level==="moderate"){ playAlertSoundOnce(soundKey, gainVal); return setInterval(()=>playAlertSoundOnce(soundKey, gainVal), 1200); }

function fireAlarm(reminder){
  if(document.getElementById("alarmOverlay")) return;
  unlockAudio();
  const level = reminder.alarm_level || "moderate";
  const holdMs = level==="persistent" ? 3000 : level==="loud" ? 1800 : 0;
  const snoozeKey = reminder.id+"_"+todayStr();
  const usedSnoozes = (state.profile.snoozeCounts||{})[snoozeKey] || 0;
  const maxSnoozeForLevel = {gentle:5, moderate:2, loud:1, persistent:0}[level];
  const canSnooze = usedSnoozes < maxSnoozeForLevel;
  const habit = state.habits.find(h=>h.id===reminder.habit_id);
  const goal = state.goals.find(g=>g.id===reminder.goal_id);

      '<div class="alarm-title">'+escapeHtml(reminder.title)+'</div>'+
      (habit?'<div class="alarm-sub">Habit: '+escapeHtml(habit.title)+'</div>':"")+
      (goal?'<div class="alarm-sub">Goal: '+escapeHtml(goal.title)+'</div>':"")+
      (reminder.message?'<div class="alarm-msg">"'+escapeHtml(reminder.message)+'"</div>':"")+
      (holdMs>0 ?
        '<button class="hold-btn" id="alarmDismissBtn"><div class="hold-fill" id="alarmHoldFill"></div><span>Hold to Stop</span></button>' :
        '<button class="btn block" data-action="dismissAlarm">Got it, done ✓</button>')+
      (canSnooze ? '<button class="btn ghost sm" data-action="snoozeAlarm" data-id="'+reminder.id+'" style="margin-top:8px;">Snooze 5 min</button>' :
        '<div class="alarm-nosnooze">No snoozing on '+level+' alerts — you\'ve got this 💪</div>')+
    '</div>';
  document.body.appendChild(overlay);
  notifyIfPermitted(reminder.title, reminder.message || "Tap ImpowerUp to open it.");
  alarmSoundHandle = startAlarmSound(level);
  if(holdMs>0){
    const btn = document.getElementById("alarmDismissBtn");
    const fill = document.getElementById("alarmHoldFill");
    let startT=null;
    function step(ts){
      if(startT===null) startT=ts;
      const pct = Math.min(100, ((ts-startT)/holdMs)*100);
      if(fill) fill.style.width = pct+"%";
      if(pct>=100){ dismissAlarm(); return; }
      holdRAF = requestAnimationFrame(step);
    }
    function start(e){ e.preventDefault(); startT=null; holdRAF = requestAnimationFrame(step); }
    function cancel(){ if(holdRAF) cancelAnimationFrame(holdRAF); holdRAF=null; startT=null; if(fill) fill.style.width="0%"; }
    if(btn){
      btn.addEventListener("mousedown", start); btn.addEventListener("touchstart", start);
      btn.addEventListener("mouseup", cancel); btn.addEventListener("mouseleave", cancel); btn.addEventListener("touchend", cancel);
    }
  }
}

function checkReminders(){

  const today = todayStr();
  const dow = dayOfWeekName(today);
  const queue = state.reminders.filter(r=>r.is_active!==false).map(r=>Object.assign({}, r, {_effTime:getEffectiveReminderTime(r, today)}))
    .concat(getVirtualEventAlarms(today).map(r=>Object.assign({}, r, {_effTime:r.time})))
    .concat(getCustomEventAlarms(today).map(r=>Object.assign({}, r, {_effTime:r.time})));
  for(const r of queue){

    const firedKey = r.id+"_"+today;
    const snoozedUntil = (state.profile.snoozedReminders||{})[r.id];

      return;
    }
  }
}

      break;
    }
    case "toggleCloudSync": {
      state.profile.cloudSyncEnabled = !state.profile.cloudSyncEnabled;
      saveState();
      render();
      if(state.profile.cloudSyncEnabled){ const ok = await syncStateToCloud(); render(); toast(ok?"Cloud sync on":"Sync on, but the first upload failed — check your connection"); }
      break;
    }
    case "syncNowCloud": { const ok = await syncStateToCloud(); render(); toast(ok?"Synced":"Sync failed — check your connection"); break; }
    case "refreshAdminList": adminClientList = null; render(); break;
    case "openNewClientForm": openNewClientForm(); break;
    case "regenNewClientPw": {
      newClientPw = generateSimplePassword();
      const pwInp = document.getElementById("nc_pw") || document.getElementById("rp_pw");
      if(pwInp) pwInp.value = newClientPw;
      break;
    }
    case "saveNewClient": {
      const displayName = document.getElementById("nc_name").value.trim();
      const username = document.getElementById("nc_username").value.trim();
      const password = document.getElementById("nc_pw").value;
      if(!displayName){ toast("Enter the client's name"); return; }
      if(!username){ toast("Enter a username"); return; }
      try{
        await adminCreateClientAccount(username, password, displayName);
        closeModal();
        adminClientList = null; render();
        toast("Client created — share the username/password with them");
      }catch(err){ toast(err.message); }
      break;
    }
    case "openResetPasswordForm": openResetPasswordForm(id, v); break;
    case "openAiClientInsights": openAiClientInsights(id); break;
    case "generateAiClientInsights": await generateAiClientInsights(id); break;
    case "saveResetPassword": {
      const password = document.getElementById("rp_pw").value;
      try{
        await adminResetClientPassword(id, password);
        closeModal();
        toast("Password reset");
      }catch(err){ toast(err.message); }
      break;
    }
    case "openAsClient": await openAsClient(id); break;
    case "saveExitClientView": await saveAndExitClientView(); break;
    case "discardExitClientView": exitClientView("Discarded changes"); break;

    case "assessOpenTake": openAssessmentTake(id); break;
    case "assessBackToList": assessBackToList(); break;
    case "refreshAssessList": _assessCache = null; render(); break;
    case "assessPick": {
      if(!_assessCurrent) break;
      _assessCurrent.responses[id] = Number(v);
      document.querySelectorAll('[data-action="assessPick"][data-id="'+id+'"]').forEach(el=>el.classList.toggle("selected", el===t));
      scheduleAssessAutosave();
      updateAssessProgressUI();
      break;
    }
    case "assessToggleCheck": {
      if(!_assessCurrent) break;
      const oi = Number(v);
      let arr = Array.isArray(_assessCurrent.responses[id]) ? _assessCurrent.responses[id].slice() : [];
      const pos = arr.indexOf(oi);
      if(pos>-1) arr.splice(pos,1); else arr.push(oi);
      _assessCurrent.responses[id] = arr;
      t.classList.toggle("selected");
      const box = t.querySelector(".assess-check-box");
      if(box) box.textContent = arr.indexOf(oi)>-1 ? "✓" : "";
      scheduleAssessAutosave();
      updateAssessProgressUI();
      break;
    }
    case "assessClearDrawing": {
      const qid2 = t.getAttribute("data-qid");
      const zone2 = t.getAttribute("data-zone")||"";
      clearAssessDrawing(id, qid2, zone2);
      break;
    }
    case "assessSubmit": await assessSubmitCurrent(); break;

    case "setTheme": state.profile.theme=v; saveState(); render(); break;
    case "pickAccent": state.profile.accent=v; saveState(); render(); break;
    case "pickAlertSound": { state.profile.alertSound = v; saveState(); render(); previewAlertSound(v); break; }
    case "requestNotificationPermission": requestNotificationPermission(); break;
    case "saveSupabaseConfig": {
      state.profile.supabaseUrl = document.getElementById("set_sbUrl").value.trim();
      state.profile.supabaseAnonKey = document.getElementById("set_sbKey").value.trim();
      saveState(); toast("Saved"); render();
      break;
    }
    case "deleteCustomCategory": {
      state.customCategories = (state.customCategories||[]).filter(c=>c.v!==id);
      saveState(); render();
      toast("Category removed");
      break;
    }
    case "previewAlertSound": { previewAlertSound(v); break; }
    case "uploadCustomAlarmSound": { const inp=document.getElementById("customAlarmFileInput"); if(inp) inp.click(); break; }
    case "removeCustomAlarmSound": {
      state.profile.customAlarmSoundName = "";
      state.profile.customAlarmSoundDataUrl = "";
      if(state.profile.alertSound==="custom") state.profile.alertSound = "classic";
      saveState(); render();
      toast("Custom sound removed");
      break;
    }
    case "pickAestheticTheme": {
      const th = THEMES[v] || THEMES.default;
      state.profile.aestheticTheme = v;
      state.profile.accent = th.accent;
      state.profile.accent2 = th.accent2;
      saveState(); applyTheme(); render();
      break;
    }
    case "exportICS": exportICS(); break;
    case "exportData": {
      const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = "impowerup-data.json"; a.click();
      URL.revokeObjectURL(url);
      break;
    }
    case "importData": document.getElementById("importFile").click(); break;
    case "resetData": {
      if(confirm("This will permanently delete all your habits, goals, reminders, and history. Continue?")){
        state = defaultState();
        saveState(); render();
      }
      break;
    }

    case "dismissAlarm": dismissAlarm(); break;
    case "snoozeAlarm": {
      const rid = id;
      const key = rid+"_"+todayStr();
      state.profile.snoozeCounts = state.profile.snoozeCounts || {};
      state.profile.snoozeCounts[key] = (state.profile.snoozeCounts[key]||0)+1;
      state.profile.snoozedReminders = state.profile.snoozedReminders || {};
      state.profile.snoozedReminders[rid] = new Date(Date.now()+5*60000).toISOString();
      saveState();
      dismissAlarm();
      toast("Snoozed for 5 minutes");
      break;
    }
  }
});

document.addEventListener("change", function(e){
  if(e.target.id === "importFile"){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const parsed = JSON.parse(ev.target.result);
        state = Object.assign(defaultState(), parsed);
        state.profile = Object.assign(defaultState().profile, parsed.profile||{});
        state.profile.onboarded = true;
        saveState(); render();
        toast("Data imported");
      }catch(err){ toast("Invalid file"); }
    };
    reader.readAsText(file);
    return;
  }
  if(e.target.id === "customAccentPicker"){
    state.profile.accent = e.target.value; saveState(); applyTheme();
    return;
  }
  if(e.target.id === "customAccentPicker2"){
    state.profile.accent2 = e.target.value; saveState(); applyTheme();
    return;
  }
  if(e.target.id === "cls_colorWheel"){ classFormColor = e.target.value; return; }
  if(e.target.id === "r_colorWheel"){ reminderFormColor = e.target.value; return; }
  if(e.target.id === "ce_colorWheel"){ ceFormColor = e.target.value; return; }
  if(e.target.id === "tsk_colorWheel"){ taskFormColor = e.target.value; return; }
  if(e.target.id === "bi_minutes"){ state.profile.brainInterruptMinutes = Math.max(1, Number(e.target.value)||10); saveState(); return; }
  if(e.target.id === "bi_level"){ state.profile.brainInterruptLevel = e.target.value; saveState(); return; }
  if(e.target.id === "sem_activeSelect"){
    state.activeSemesterId = e.target.value;
    saveState(); render();
    return;
  }
  if(e.target.id === "alertVolumeSlider"){
    state.profile.alertVolume = Number(e.target.value);
    saveState();
    previewAlertSound(state.profile.alertSound || "classic");
    return;
  }
  if(e.target.id === "ce_repeat" || e.target.id === "ce_repeatUnit"){
    updateEventRepeatUI();
    return;
  }
  if(e.target.id === "pomo_preset"){
    loadPomodoroPresetIntoForm(e.target.value);
    return;
  }
  if(e.target.id === "customAlarmFileInput"){
    const file = e.target.files[0];
    if(!file) return;
    const maxBytes = 1.5*1024*1024;
    if(file.size > maxBytes){ toast("That file is too big — please use a short clip under 1.5MB"); e.target.value=""; return; }
    const reader = new FileReader();
    reader.onload = function(ev){
      state.profile.customAlarmSoundName = file.name;
      state.profile.customAlarmSoundDataUrl = ev.target.result;
      state.profile.alertSound = "custom";
      saveState(); render();
      toast("Custom sound uploaded");
    };
    reader.onerror = function(){ toast("Couldn't read that file"); };
    reader.readAsDataURL(file);
    return;
  }
  if(e.target.id === "proofPhotoInput"){
    const file = e.target.files[0];
    if(!file || !window._proofTarget) return;
    fileToCompressedDataUrl(file, 500, 0.6).then(function(dataUrl){
      const target = window._proofTarget;
      if(target.kind==="habitlog"){
        const l = state.habitLogs.find(x=>x.id===target.id); if(l) l.proof_photo_url = dataUrl;
        saveState(); render();
        toast("Proof photo added");
        checkNewBadges();
      } else if(target.kind==="goal"){
        const g = state.goals.find(x=>x.id===target.id); if(g) g.proof_photo_url = dataUrl;
        saveState(); render();
        toast("Proof photo added");
        checkNewBadges();
      } else if(target.kind==="habit-complete"){
        const h = state.habits.find(x=>x.id===target.habitId);
        if(h){
          const prevXp = totalPoints();
          let logEntry = findHabitLog(h.id, target.dateStr);
          const wasAlreadyDone = !!logEntry;
          if(!logEntry){
            logEntry = {id:uid(), habit_id:h.id, completed_date:target.dateStr, points_earned:h.points_per_completion||10, completed_at:new Date().toISOString()};
            state.habitLogs.push(logEntry);
          }
          logEntry.proof_photo_url = dataUrl;
          saveState(); render();
          if(!wasAlreadyDone){
            celebrate();
            toast("Proof added — +"+(h.points_per_completion||10)+" XP!");
            checkLevelUp(prevXp);
          } else {
            toast("Proof photo added");
            checkNewBadges();
          }
          if(state.profile.notifyMentorOnProof && state.profile.mentorName){
            promptMentorNotify("Proof added: "+h.title);
          }
        }
      }
      window._proofTarget = null;
      e.target.value = "";
    }).catch(function(){ toast("Couldn't process that photo"); });
    return;
  }
  if(e.target.classList && e.target.classList.contains("blk_type")){
    collectBlocksFromDOM();
    const idx = Number(e.target.getAttribute("data-idx"));
    if(templateFormBlocks[idx]){ templateFormBlocks[idx].type = e.target.value; }
    rerenderBlockList();
    return;
  }
});

function refreshHabitFormSelections(){
  document.querySelectorAll('[data-action="pickCat"]').forEach(c=>c.classList.toggle("selected", c.getAttribute("data-v")===formCat));
  document.querySelectorAll('[data-action="pickFreq"]').forEach(c=>c.classList.toggle("selected", c.getAttribute("data-v")===formFreq));
  document.querySelectorAll('[data-action="pickDay"]').forEach(c=>c.classList.toggle("selected", formDays.includes(c.getAttribute("data-v"))));
  document.querySelectorAll('[data-action="pickColor"]').forEach(c=>c.classList.toggle("selected", c.getAttribute("data-v")===formColor));
}
function refreshGoalFormSelections(){
  document.querySelectorAll('[data-action="pickGCat"]').forEach(c=>c.classList.toggle("selected", c.getAttribute("data-v")===goalFormCat));
  document.querySelectorAll('[data-action="pickGColor"]').forEach(c=>c.classList.toggle("selected", c.getAttribute("data-v")===goalFormColor));
}
function refreshReminderFormSelections(){
  document.querySelectorAll('[data-action="pickRDay"]').forEach(c=>c.classList.toggle("selected", reminderFormDays.includes(c.getAttribute("data-v"))));
}
function collectMilestonesFromDOM(){
  document.querySelectorAll("#milestoneList .msInput").forEach((inp,i)=>{ if(goalFormMilestones[i]) goalFormMilestones[i].title = inp.value; });
}
function rerenderMilestoneList(){
  const list = document.getElementById("milestoneList");
  list.innerHTML = goalFormMilestones.map((m,i)=>
    '<div class="row-inline" style="margin-bottom:6px;"><input type="text" class="msInput" value="'+escapeHtml(m.title)+'" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)"><button class="icon-btn" type="button" data-action="removeMilestoneRow" data-idx="'+i+'">✕</button></div>'
  ).join("");
}

/* ============ Mentor read-only view ============ */
function renderMentorView(code){
  document.body.setAttribute("data-theme","light");
  document.documentElement.style.setProperty("--accent", "#2563EB");
  const app = document.getElementById("app");
  const snap = decodeShareCode(code);
  if(!snap){ app.innerHTML = '<div class="card" style="margin:40px auto;max-width:420px;text-align:center;">⚠️ This share link looks invalid or corrupted. Ask for a fresh link.</div>'; return; }
  let html = '<div style="max-width:600px;margin:30px auto;padding:0 16px;">';
  html += '<div class="card" style="text-align:center;background:linear-gradient(135deg,var(--accent),#14B8A6);color:#fff;border:none;">';
  html += '<div style="font-size:13px;opacity:.85;">Shared Progress Snapshot</div>';
  html += '<h1 style="color:#fff;margin:6px 0;">'+escapeHtml(snap.name||"Someone")+'\'s Journey</h1>';
  html += '<div style="font-size:13px;opacity:.85;">Generated '+fmtDatePretty(snap.generatedAt ? snap.generatedAt.slice(0,10) : todayStr())+'</div></div>';
  html += '<div class="grid cols-3" style="margin-top:16px;">'+stat("Lv "+snap.level, snap.levelTitle)+stat(snap.totalPoints,"Total XP")+stat(snap.bestStreak,"Best streak")+'</div>';
  if(snap.badges && snap.badges.length){
    html += '<div class="section-head"><h2>Badges Earned</h2></div><div class="grid cols-3">'+snap.badges.map(b=>'<div class="card" style="text-align:center;padding:14px;"><div style="font-size:26px;">'+b.emoji+'</div><div style="font-size:12px;font-weight:800;margin-top:4px;">'+escapeHtml(b.title)+'</div></div>').join("")+'</div>';
  }
  if(snap.habits && snap.habits.length){
    html += '<div class="section-head"><h2>Habits</h2></div>'+snap.habits.map(h=>'<div class="habit-card"><div class="emoji-badge" style="background:var(--surface-2)">'+(h.emoji||"✅")+'</div><div class="hc-body"><div class="hc-title">'+escapeHtml(h.title)+'</div><div class="hc-meta"><span>🔥 current '+h.currentStreak+'</span><span>🏆 best '+h.bestStreak+'</span></div></div></div>').join("");
  }
  if(snap.goals && snap.goals.length){
    html += '<div class="section-head"><h2>Goals</h2></div>'+snap.goals.map(g=>'<div class="card" style="margin-bottom:10px;"><div class="hc-title">'+(g.emoji||"🎯")+' '+escapeHtml(g.title)+'</div><div class="progress-bar"><div style="width:'+(g.progress||0)+'%;"></div></div><div class="hc-meta" style="margin-top:6px;">'+(g.progress||0)+'% complete</div></div>').join("");
  }
  if(snap.proofCount){
    html += '<div class="card" style="margin-top:16px;text-align:center;">📸 '+snap.proofCount+' proof photo(s) attached — viewable in person on their device under Sharing.</div>';
  }
  if(!snap.isReply){
    html += '<div class="card" style="margin-top:16px;"><h2>💬 Messages</h2>';
    if(snap.messages && snap.messages.length){
      html += '<div style="margin-bottom:10px;">'+snap.messages.slice().sort((a,b)=>(a.at||"").localeCompare(b.at||"")).map(m=>{
        const fromOwner = m.sender==="me";
        return '<div style="display:flex;'+(fromOwner?"justify-content:flex-start;":"justify-content:flex-end;")+'margin-bottom:8px;">'+
          '<div style="max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;'+(fromOwner?"background:var(--surface-2);border-bottom-left-radius:4px;":"background:var(--accent);color:#fff;border-bottom-right-radius:4px;")+'">'+
          escapeHtml(m.text)+'<div style="font-size:10px;opacity:.7;margin-top:3px;">'+(fromOwner?escapeHtml(snap.name||"Them"):"You")+'</div></div></div>';
      }).join("")+'</div>';
    } else {
      html += '<p class="hc-meta">No messages yet.</p>';
    }
    html += '<div class="field"><textarea id="mentorReplyText" placeholder="Write a reply…"></textarea></div>'+
      '<button class="btn block" data-action="genMentorReplyCode" data-code="'+code+'">Generate Reply Code</button>'+
      '<div id="mentorReplyOutput" style="display:none;margin-top:10px;"><div class="field"><label>Reply Code — copy and send this back to '+escapeHtml(snap.name||"them")+'</label><textarea id="mentorReplyCodeBox" readonly></textarea></div>'+
      '<button class="btn secondary block" data-action="copyMentorReplyCode">Copy Reply Code</button></div>'+
      '</div>';
  }
  html += '<div class="card" style="margin-top:16px;text-align:center;"><p class="hc-meta">This is a private one-time snapshot — it won\'t update automatically. Ask '+escapeHtml(snap.name||"them")+' to send a fresh link anytime for the latest progress.</p></div>';
  html += '</div>';
  app.innerHTML = html;
}

/* ============ Init ============ */
bootApp();
setInterval(checkReminders, 15000);

})();
</script>
