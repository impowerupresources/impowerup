<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImpowerUp</title>
<style>
  :root{
    --accent:#2563EB;
    --accent2:#14B8A6;
    --accent3:#FB923C;
    --accent-rgb:37,99,235;
    --bg:#F7F5FC;
    --surface:#FFFFFF;
    --surface-2:#F1ECFB;
    --text:#1F1B2E;
    --text-muted:#726C87;
    --border:#E9E1FA;
    --radius:20px;
    --shadow:0 4px 18px rgba(90,50,180,0.08);
    --shadow-lg:0 16px 40px rgba(90,50,180,0.18);
    --danger:#EF4444;
    --success:#10B981;
  }
  [data-theme="dark"]{
    --bg:#15111F;
    --surface:#1E1930;
    --surface-2:#28203E;
    --text:#F5F2FC;
    --text-muted:#AA9FC7;
    --border:#372C52;
    --shadow:0 4px 18px rgba(0,0,0,0.4);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:var(--app-font,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  #app{max-width:900px;margin:0 auto;padding:20px 16px 104px;min-height:100vh;}
  @media(min-width:900px){
    #app{max-width:1080px;padding:26px 32px 32px 232px;}
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;}
  .brand .logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--shadow);}
  .points-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);padding:9px 15px;border-radius:999px;font-weight:800;box-shadow:var(--shadow);font-size:14px;white-space:nowrap;}

  nav.sidebar{display:none;}
  @media(min-width:900px){
    nav.sidebar{
      display:flex;flex-direction:column;gap:3px;position:fixed;left:0;top:0;bottom:0;width:216px;
      padding:24px 12px;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;
    }
    nav.sidebar .brand{padding:0 10px;margin-bottom:22px;}
  }
  nav.sidebar a, nav.bottombar a{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--text-muted);
    text-decoration:none;font-weight:700;font-size:13.5px;transition:background .15s,color .15s;
  }
  nav.sidebar a.active, nav.bottombar a.active{background:var(--surface-2);color:var(--accent);}
  nav.sidebar a:hover{background:var(--surface-2);}

  nav.bottombar{
    position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
    background:var(--surface);border-top:1px solid var(--border);padding:5px 1px calc(5px + env(safe-area-inset-bottom));
    z-index:40;overflow-x:auto;
  }
  nav.bottombar a{flex-direction:column;gap:1px;font-size:9.5px;padding:6px 3px;flex:1;text-align:center;border-radius:10px;min-width:40px;}
  nav.bottombar a .ic{font-size:19px;}
  @media(min-width:900px){nav.bottombar{display:none;}}

  h1{font-size:25px;margin:0 0 4px;font-weight:800;}
  h2{font-size:18px;margin:0 0 12px;font-weight:800;}
  .subtitle{color:var(--text-muted);font-size:14px;margin:0 0 20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .grid{display:grid;gap:14px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:600px){.grid.cols-3{grid-template-columns:repeat(3,1fr);gap:8px;} .grid.cols-2{grid-template-columns:1fr 1fr;}}

  .stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 10px;box-shadow:var(--shadow);text-align:center;}
  .stat .num{font-size:20px;font-weight:800;}
  .stat .lbl{font-size:11px;color:var(--text-muted);margin-top:2px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
  .section-head h2{margin:0;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 18px;font-weight:800;font-size:14.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow);transition:transform .1s;}
  .btn:active{transform:scale(.96);}
  .btn.secondary{background:var(--surface-2);color:var(--text);box-shadow:none;}
  .btn.ghost{background:transparent;color:var(--accent);box-shadow:none;padding:8px 10px;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.sm{padding:9px 14px;font-size:13px;}
  .btn.block{width:100%;}
  .icon-btn{background:var(--surface-2);border:none;border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:15px;flex-shrink:0;}

  .empty{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty .big{font-size:40px;margin-bottom:10px;}

  .habit-card,.goal-card,.reminder-card,.session-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .emoji-badge{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;}
  .hc-body{flex:1;min-width:0;}
  .hc-title{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hc-meta{font-size:12px;color:var(--text-muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-muted);}
  .check-circle{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:19px;color:var(--text-muted);background:var(--surface);transition:transform .15s;}
  .check-circle.done{background:var(--success);border-color:var(--success);color:#fff;}
  .check-circle:active{transform:scale(.9);}
  .check-circle.pop{animation:pop .4s ease;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.3);}100%{transform:scale(1);}}

  .progress-bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px;}
  .progress-bar > div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,10,28,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(3px);}
  @media(min-width:640px){.modal-overlay{align-items:center;}}
  .modal{position:relative;background:var(--surface);border-radius:24px 24px 0 0;padding:22px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  @media(min-width:640px){.modal{border-radius:24px;}}
  .modal h2{margin-bottom:16px;padding-right:34px;}
  .modal-close-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;cursor:pointer;z-index:5;flex-shrink:0;}
  .modal-close-x:hover{background:var(--border);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:var(--text-muted);}
  .field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea,.field input[type=email],.field input[type=tel]{
    width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row-inline{display:flex;gap:10px;}
  .row-inline .field{flex:1;}
  .chip-group{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--text-muted);}
  .chip.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .swatch-group{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;flex-shrink:0;}
  .swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--surface);}
  .colorwheel-input{width:36px;height:36px;border:none;border-radius:50%;padding:0;overflow:hidden;background:none;cursor:pointer;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}

  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:250;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;max-width:88vw;text-align:center;}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px);}to{opacity:1;transform:translate(-50%,0);}}

  .fab-confetti{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden;}
  .confetti-piece{position:absolute;top:-10px;font-size:18px;animation:fall 1.4s ease-in forwards;}
  @keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0;}}
  .xp-float{position:fixed;font-weight:900;font-size:15px;color:var(--accent);z-index:160;pointer-events:none;animation:floatUp 1s ease-out forwards;}
  @keyframes floatUp{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-46px);}}

  .day-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
  .day-pill{flex-shrink:0;width:54px;padding:9px 0;border-radius:16px;text-align:center;border:1px solid var(--border);background:var(--surface);cursor:pointer;}
  .day-pill.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
  .day-pill .dname{font-size:10px;opacity:.75;}
  .day-pill .dnum{font-size:15px;font-weight:800;}

  .timeline-item{display:flex;gap:12px;margin-bottom:2px;}
  .timeline-time{width:58px;flex-shrink:0;font-size:12px;color:var(--text-muted);padding-top:14px;text-align:right;font-weight:700;}
  .timeline-line{width:2px;background:var(--border);position:relative;flex-shrink:0;}
  .timeline-dot{position:absolute;left:-4px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .timeline-content{flex:1;padding:12px 0;}

  .weekbar{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px;}
  .weekbar .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;}
  .weekbar .bar{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:4px;}
  .weekbar .lbl{font-size:11px;color:var(--text-muted);}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);gap:10px;}
  .toggle-row:last-child{border-bottom:none;}
  .switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);flex-shrink:0;}
  .switch.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on::after{left:20px;}

  .hero-card{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:24px;padding:20px;color:#fff;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .hero-ring{position:relative;width:78px;height:78px;flex-shrink:0;}
  .hero-ring svg{width:78px;height:78px;transform:rotate(-90deg);}
  .hero-level{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;}
  .hero-info{flex:1;min-width:0;}
  .hero-title{font-weight:900;font-size:16px;}
  .hero-xp{font-size:12px;opacity:.9;margin-top:2px;}
  .hero-badges{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
  .hero-badges span{font-size:17px;}

  .hero-card-v2{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:24px;padding:22px;color:#fff;box-shadow:var(--shadow-lg);margin-bottom:20px;}
  .hero-v2-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .hero-v2-level{font-size:14px;opacity:.85;font-weight:700;}
  .hero-v2-trophy{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
  .hero-v2-xp{font-size:34px;font-weight:900;margin-top:6px;display:flex;align-items:center;gap:9px;}
  .hero-v2-progress-label{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-top:20px;margin-bottom:6px;font-weight:600;}
  .hero-v2-bar{height:10px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden;}
  .hero-v2-bar > div{height:100%;background:#fff;border-radius:999px;transition:width .3s;}
  .hero-v2-pills{display:flex;gap:10px;margin-top:16px;}
  .hero-v2-pill{flex:1;background:rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;min-width:0;}
  .hero-v2-pill-label{font-size:12px;opacity:.9;display:flex;align-items:center;gap:5px;font-weight:700;}
  .hero-v2-pill-value{font-size:19px;font-weight:900;margin-top:3px;}
  .stat-icon-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 14px;box-shadow:var(--shadow);}
  .stat-icon-card .sic-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:12px;}
  .stat-icon-card .sic-num{font-size:21px;font-weight:900;}
  .stat-icon-card .sic-lbl{font-size:11.5px;color:var(--text-muted);margin-top:2px;font-weight:700;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:640px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
  .badge-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);}
  .badge-card.locked{opacity:.35;filter:grayscale(1);}
  .badge-card .be{font-size:26px;}
  .badge-card .bt{font-size:11px;font-weight:800;margin-top:6px;}
  .badge-card .bd{font-size:9.5px;color:var(--text-muted);margin-top:2px;}

  .focus-ring{width:220px;height:220px;border-radius:50%;border:10px solid var(--surface-2);display:flex;align-items:center;justify-content:center;margin:20px auto;position:relative;}
  .focus-ring .time{font-size:38px;font-weight:900;}

  textarea#shareOutput,textarea#shareCodeBox{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--border);padding:10px;background:var(--bg);color:var(--text);font-size:12px;font-family:monospace;}

  .alarm-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
  .alarm-overlay.level-gentle{background:rgba(139,92,246,.25);}
  .alarm-overlay.level-moderate{background:rgba(139,92,246,.4);}
  .alarm-overlay.level-loud{background:rgba(251,146,60,.5);animation:flashBg 1s infinite;}
  .alarm-overlay.level-persistent{background:rgba(239,68,68,.55);animation:flashBg .5s infinite;}
  @keyframes flashBg{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}
  .alarm-box{background:var(--surface);border-radius:28px;padding:32px 26px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:alarmPop .35s ease;}
  .alarm-overlay.level-persistent .alarm-box{animation:alarmPop .35s ease, shake .5s ease infinite;}
  @keyframes alarmPop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(3px);}30%,50%,70%{transform:translateX(-6px);}40%,60%{transform:translateX(6px);}}
  .alarm-emoji{font-size:52px;}
  .alarm-title{font-size:20px;font-weight:900;margin-top:6px;}
  .alarm-sub{font-size:13px;color:var(--text-muted);margin-top:4px;}
  .alarm-msg{font-size:13px;font-style:italic;margin-top:8px;color:var(--text-muted);}
  .hold-btn{position:relative;overflow:hidden;width:100%;margin-top:18px;background:var(--danger);color:#fff;border:none;border-radius:16px;padding:16px;font-weight:900;font-size:15px;}
  .hold-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:rgba(255,255,255,.4);}
  .hold-btn span{position:relative;}
  .alarm-nosnooze{font-size:12px;color:var(--text-muted);margin-top:10px;}

  .segmented{display:flex;background:var(--surface-2);border-radius:16px;padding:4px;gap:2px;flex:1;}
  .segmented .seg{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 6px;border-radius:13px;font-weight:800;font-size:13.5px;color:var(--text-muted);cursor:pointer;text-align:center;}
  .segmented .seg.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  .planner-header-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .dropdown-btn{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);padding:11px 16px;border-radius:14px;font-weight:800;font-size:13.5px;box-shadow:var(--shadow);white-space:nowrap;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-daylabel{text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);padding-bottom:6px;}
  .cal-cell{position:relative;text-align:center;padding:12px 2px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--text);}
  .cal-cell.dim{color:var(--text-muted);opacity:.4;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .cal-cell.selected{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:none;}
  .cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--accent2);margin:3px auto 0;}
  .cal-cell .expand-ic{position:absolute;top:1px;right:2px;font-size:8px;opacity:.5;line-height:1;padding:2px;cursor:pointer;}
  .cal-cell.rich{text-align:left;padding:5px 4px;min-height:80px;display:flex;flex-direction:column;gap:2px;border-radius:12px;}
  .cal-cell.rich .cal-daynum{font-size:12px;font-weight:800;text-align:right;padding-right:14px;}
  .cal-cell.rich .cal-chip{font-size:9px;font-weight:700;line-height:1.3;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(var(--accent-rgb),.15);}
  .cal-cell.rich.selected .cal-chip{background:rgba(255,255,255,.28);color:#fff;}
  .cal-cell.rich .cal-more{font-size:9px;font-weight:700;color:var(--text-muted);}
  .cal-cell.rich.selected .cal-more{color:rgba(255,255,255,.85);}
  @media(max-width:520px){ .cal-cell.rich{min-height:58px;} .cal-cell.rich .cal-chip:nth-child(n+3){display:none;} }
  .week-glance-vert .wg-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:14px;cursor:pointer;}
  .week-glance-vert .wg-row + .wg-row{margin-top:4px;}
  .week-glance-vert .wg-daycol{width:44px;flex-shrink:0;text-align:center;}
  .week-glance-vert .wg-list{flex:1;min-width:0;font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .picker-grid{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:760px){ .picker-grid{grid-template-columns:1.15fr 0.85fr;align-items:start;} }
  .proof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .proof-thumb{border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);position:relative;}
  .proof-thumb img{width:100%;height:100%;object-fit:cover;}
  .proof-thumb .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:3px 5px;}

  /* ============ Assessments ============ */
  .assess-status-pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;}
  .assess-status-pill.not_started{background:var(--surface-2);color:var(--text-muted);}
  .assess-status-pill.in_progress{background:rgba(var(--accent-rgb),.15);color:var(--accent);}
  .assess-status-pill.submitted{background:var(--success);color:#fff;}
  .assess-overall-card{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
  .assess-overall-card .progress-bar{background:rgba(255,255,255,.3);}
  .assess-overall-card .progress-bar>div{background:#fff;}
  .assess-q-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
  .assess-q-prompt{font-weight:800;font-size:14.5px;margin-bottom:10px;line-height:1.4;}
  .assess-opts{display:flex;flex-direction:column;gap:8px;}
  .assess-opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;transition:all .12s;}
  .assess-opt.selected{border-color:var(--accent);background:rgba(var(--accent-rgb),.1);color:var(--text);font-weight:800;}
  .assess-opt.readonly{cursor:default;}
  .assess-vs-row{display:flex;gap:10px;align-items:stretch;}
  .assess-vs-row .assess-opt{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:64px;}
  .assess-vs-divider{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--text-muted);width:26px;flex-shrink:0;}
  .assess-check-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--border);cursor:pointer;}
  .assess-check-row+.assess-check-row{margin-top:8px;}
  .assess-check-row.selected{border-color:var(--accent);background:rgba(var(--accent-rgb),.1);}
  .assess-check-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px;}
  .assess-check-row.selected .assess-check-box{background:var(--accent);border-color:var(--accent);}
  .assess-zone-label{font-size:12px;font-weight:800;color:var(--text-muted);margin:14px 0 6px;}
  .assess-zone-label:first-child{margin-top:0;}
  .assess-canvas-wrap{position:relative;}
  .assess-canvas{touch-action:none;background:#fff;border:1.5px solid var(--border);border-radius:12px;width:100%;height:180px;display:block;cursor:crosshair;}
  .assess-canvas-clear{position:absolute;top:8px;right:8px;background:var(--surface-2);border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;}
  .assess-info-card{background:rgba(var(--accent-rgb),.08);border:1.5px dashed var(--accent);border-radius:16px;padding:18px;text-align:center;margin-bottom:12px;font-size:13.5px;font-weight:600;}
  .assess-save-indicator{font-size:11.5px;color:var(--text-muted);text-align:center;margin:6px 0 14px;}
  .assess-sticky-bar{position:sticky;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 0;margin-top:10px;z-index:20;}
  @media(min-width:760px){ .assess-vs-row{max-width:520px;} }

  /* ---- Print / PDF export ---- */
  #printAssessArea{display:none;}
  .pa-header{border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:16px;}
  .pa-header h1{font-size:20px;margin:0 0 4px;}
  .pa-header .pa-meta{font-size:12px;color:#555;}
  .pa-section-title{font-size:14px;font-weight:800;margin:18px 0 8px;border-bottom:1px solid #ccc;padding-bottom:4px;}
  .pa-q{margin-bottom:10px;page-break-inside:avoid;}
  .pa-q .pa-prompt{font-weight:700;font-size:12.5px;margin-bottom:3px;}
  .pa-q .pa-answer{font-size:12.5px;color:#111;padding-left:10px;}
  .pa-q .pa-answer.pa-unanswered{color:#999;font-style:italic;}
  .pa-zone-label{font-size:11px;font-weight:700;color:#555;margin:8px 0 3px;}
  .pa-drawing-img{max-width:320px;max-height:180px;border:1px solid #ccc;border-radius:6px;display:block;margin:4px 0;}
  .pa-score{background:#f4f4f4;border:1px solid #ccc;border-radius:8px;padding:10px;margin-top:14px;font-size:12.5px;white-space:pre-wrap;}
  @media print{
    body>*:not(#printAssessArea){display:none!important;}
    #printAssessArea{display:block!important;}
    body{background:#fff;}
  }
</style>
</head>

/* ============ Level / Badges ============ */
function levelFromXp(xp){
  let level=1, xpNeeded=100, remaining=Math.max(0,xp||0);
  while(remaining>=xpNeeded){ remaining-=xpNeeded; level++; xpNeeded=Math.round(xpNeeded*1.25); }
  const title = LEVEL_TITLES[Math.min(level-1, LEVEL_TITLES.length-1)];
  return {level, title, into:remaining, needed:xpNeeded, pct: Math.min(100, Math.round((remaining/xpNeeded)*100))};
}

/* ---- Multi-profile ("who's using this device") ---- */
function loadProfiles(){ try{ return JSON.parse(localStorage.getItem(PROFILES_KEY))||[]; }catch(e){ return []; } }
function saveProfiles(list){ localStorage.setItem(PROFILES_KEY, JSON.stringify(list)); }
function getCurrentProfileId(){ return localStorage.getItem(CURRENT_PROFILE_KEY); }
function setCurrentProfileId(id){ if(id) localStorage.setItem(CURRENT_PROFILE_KEY, id); else localStorage.removeItem(CURRENT_PROFILE_KEY); }
function storeKeyFor(profileId){ return "impowerup_data_v2__"+profileId; }

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed);
    merged.profile = Object.assign(defaultState().profile, parsed.profile||{});
    return merged;
  }catch(e){ return defaultState(); }
}
function saveState(){ if(STORE_KEY) localStorage.setItem(STORE_KEY, JSON.stringify(state)); if(typeof maybeAutoSyncCloud==="function") maybeAutoSyncCloud(); }
function displayName(){ return state.profile.nickname || state.profile.firstName || "there"; }
function fullName(){ return (state.profile.firstName+" "+state.profile.lastName).trim(); }

/* Read another profile's stats without disturbing the currently active session */
function computeProfileSummary(profileId){
  const savedState = state, savedKey = STORE_KEY;
  const key = storeKeyFor(profileId);
  const raw = localStorage.getItem(key);
  if(!raw) return null;
  STORE_KEY = key;
  try{ state = loadState(); }catch(e){ state = savedState; STORE_KEY = savedKey; return null; }
  const lvl = levelFromXp(totalPoints());
  const summary = {
    xp: totalPoints(), level: lvl.level, levelTitle: lvl.title,
    habitCount: state.habits.filter(h=>h.is_active!==false).length,
    activeGoals: state.goals.filter(g=>g.status==="active").length,
    completedGoals: state.goals.filter(g=>g.status==="completed").length,
    completions: state.habitLogs.length,
    bestStreak: bestActiveStreak(),
    badgeCount: computeEarnedBadges().length,
    lastActive: state.habitLogs.length ? state.habitLogs.map(l=>l.completed_date).sort().slice(-1)[0] : null
  };
  state = savedState; STORE_KEY = savedKey;
  return summary;
}

/* ============ Background push (Supabase) ============ */
function pushBackendConfigured(){
  return !!(state && state.profile && state.profile.supabaseUrl && state.profile.supabaseAnonKey);
}
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function sbHeaders(){
  return { apikey: state.profile.supabaseAnonKey, Authorization: "Bearer "+state.profile.supabaseAnonKey, "Content-Type":"application/json" };
}
function sbRest(path, opts){
  return fetch(state.profile.supabaseUrl.replace(/\/$/,"")+"/rest/v1/"+path, Object.assign({headers: sbHeaders()}, opts||{}));
}
async function subscribeToPush(){
  if(!pushBackendConfigured()){ toast("Add your Supabase URL + anon key in Settings first"); return false; }
  if(!("serviceWorker" in navigator) || !("PushManager" in window)){ toast("This browser doesn't support push"); return false; }
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    }
    const json = sub.toJSON();
    const res = await sbRest("push_subscriptions?on_conflict=endpoint", {
      method:"POST",
      headers: Object.assign(sbHeaders(), {Prefer:"resolution=merge-duplicates"}),
      body: JSON.stringify({ endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth })
    });
    if(!res.ok){ toast("Couldn't save push subscription — check your Supabase URL/key"); return false; }
    window._pushEndpoint = json.endpoint;
    state.profile.pushEnabled = true; saveState();
    return true;
  }catch(e){ toast("Push subscription failed: "+e.message); return false; }
}
function computeNextFireAt(time, days){
  if(!time || !days || !days.length) return null;
  const [hh,mm] = time.split(":").map(Number);
  const now = new Date();
  for(let i=0;i<8;i++){
    const cand = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i, hh, mm, 0, 0);
    if(cand <= now) continue;
    if(days.includes(DAY_NAMES[cand.getDay()])) return cand.toISOString();
  }
  return null;
}
let _lastPushSync = 0;
async function syncAllAlertsToServer(force){
  if(!pushBackendConfigured() || !state.profile.pushEnabled) return;
  const nowMs = Date.now();
  if(!force && nowMs - _lastPushSync < 120000) return;
  _lastPushSync = nowMs;
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if(!sub) return;
    const endpoint = sub.toJSON().endpoint;
    const active = state.reminders.filter(r=>r.is_active!==false && r.time && (r.days||[]).length);
    for(const r of active){
      const next = computeNextFireAt(r.time, r.days);
      await sbRest("scheduled_alerts?on_conflict=id", {
        method:"POST",
        headers: Object.assign(sbHeaders(), {Prefer:"resolution=merge-duplicates"}),
        body: JSON.stringify({ id:r.id, subscription_endpoint:endpoint, title:r.title, body:r.message||"", days:r.days, time_of_day:r.time, next_fire_at:next, is_active:true, updated_at:new Date().toISOString() })
      });
    }
    // Reconcile deletions: remove any server-side alerts that no longer exist locally.
    const listRes = await sbRest("scheduled_alerts?subscription_endpoint=eq."+encodeURIComponent(endpoint)+"&select=id");
    if(listRes.ok){
      const serverIds = (await listRes.json()).map(r=>r.id);
      const localIds = new Set(active.map(r=>r.id));
      const stale = serverIds.filter(sid=>!localIds.has(sid));
      for(const sid of stale){
        await sbRest("scheduled_alerts?id=eq."+encodeURIComponent(sid), {method:"DELETE"});
      }
    }
  }catch(e){}
}

/* ============ Assessments (client-facing engine) ============ */
const ADMIN_ONLY_ASSESSMENT_IDS = ["client_interview"]; // filled out by the admin about a client — never shown to clients (also enforced server-side via RLS)
let _assessCache = null;          // array of assignment rows (each with embedded `template`) for the logged-in user
let _assessView = {mode:"list"};  // {mode:"list"} or {mode:"take"}
let _assessCurrent = null;        // {templateId, template, responses, status, submittedAt}
let _assessSaveTimer = null;
let _assessDrawActive = false;
let _hasAnyAssessment = null;     // null=unknown, true/false=known — controls whether the nav tab is shown at all
let _hasAnyAssessmentLoading = false;

function maybeCheckHasAnyAssessment(){
  if(_hasAnyAssessmentLoading || _hasAnyAssessment!==null) return;
  if(!state || !state.profile || !state.profile.cloudSession) return;
  _hasAnyAssessmentLoading = true;
  checkHasAnyAssessment().finally(()=>{ _hasAnyAssessmentLoading = false; });
}
async function checkHasAnyAssessment(){
  if(!(await ensureFreshSession())){ _hasAnyAssessment = false; return; }
  try{
    const uid = state.profile.cloudSession.user_id;
    const res = await fetch(SB_ACCOUNTS_URL+"/rest/v1/assessment_assignments?user_id=eq."+uid+"&enabled=eq.true&select=id&limit=1", {headers: acctHeaders(true)});
    _hasAnyAssessment = res.ok ? (await res.json()).length>0 : false;
  }catch(e){ _hasAnyAssessment = false; }
  render();
}

async function loadAssessAssignments(){
  if(!(await ensureFreshSession())) return [];
  try{
    const uid = state.profile.cloudSession.user_id;
    const res = await fetch(SB_ACCOUNTS_URL+"/rest/v1/assessment_assignments?user_id=eq."+uid+"&enabled=eq.true&select=*,template:assessment_templates(id,title,description,sections)&order=updated_at.desc", {headers: acctHeaders(true)});
    if(!res.ok) return [];
    const rows = await res.json();
    return rows.filter(r=>ADMIN_ONLY_ASSESSMENT_IDS.indexOf(r.template_id)===-1); // belt-and-suspenders — RLS already blocks these server-side
  }catch(e){ return []; }
}

function assessIsAnswered(q, val){
  // Checklists allow selecting anywhere from none to all of the items — any state (including untouched) is a complete answer.
  if(q.type==="checklist") return true;
  if(val===undefined || val===null) return false;
  if(q.type==="single_choice" || q.type==="versus") return typeof val==="number";
  if(q.type==="text") return typeof val==="string" && val.trim().length>0;
  if(q.type==="drawing"){
    if(q.zones && q.zones.length){
      if(!val || typeof val!=="object") return false;
      return q.zones.some(z=>val[z] && String(val[z]).indexOf("data:image")===0);
    }
    return typeof val==="string" && val.indexOf("data:image")===0;
  }
  return !!val;
}
function assessCountsForTemplateResponses(template, responses){
  let total=0, answered=0;
  ((template && template.sections)||[]).forEach((sec,si)=>{
    if(sec.deleted) return;
    (sec.questions||[]).forEach((q,qi)=>{
      if(q.type==="info" || q.deleted) return;
      total++;
      const qid = "s"+si+"_q"+qi;
      if(assessIsAnswered(q, responses ? responses[qid] : undefined)) answered++;
    });
  });
  return {answered, total};
}
function assessFindFirstUnanswered(template, responses){
  let found = null;
  ((template && template.sections)||[]).forEach((sec,si)=>{
    if(found || sec.deleted) return;
    (sec.questions||[]).forEach((q,qi)=>{
      if(found || q.type==="info" || q.deleted) return;
      const qid = "s"+si+"_q"+qi;
      if(!assessIsAnswered(q, responses ? responses[qid] : undefined)) found = qid;
    });
  });
  return found;
}
function assessBlockIncompleteSubmit(template, responses, prefix){
  const missingQid = assessFindFirstUnanswered(template, responses);
  if(!missingQid) return false;
  toast("Please answer every question before submitting — jumping to the first one you missed.");
  const el = document.getElementById("qcard_"+prefix+"_"+missingQid);
  if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  return true;
}
function assessOverallCounts(){
  let total=0, answered=0;
  (_assessCache||[]).forEach(row=>{
    const tmpl = row.template;
    if(!tmpl) return;
    const responses = (_assessCurrent && _assessCurrent.templateId===row.template_id) ? _assessCurrent.responses : (row.responses||{});
    const c = assessCountsForTemplateResponses(tmpl, responses);
    total += c.total; answered += c.answered;
  });
  return {answered, total, pct: total ? Math.round(answered/total*100) : 0};
}
function updateAssessProgressUI(){
  if(!_assessCurrent) return;
  const c = assessCountsForTemplateResponses(_assessCurrent.template, _assessCurrent.responses);
  const pct = c.total ? Math.round(c.answered/c.total*100) : 0;
  const bar = document.getElementById("assessSelfBar"); if(bar) bar.style.width = pct+"%";
  const txt = document.getElementById("assessSelfBarTxt"); if(txt) txt.textContent = c.answered+" of "+c.total+" answered ("+pct+"%)";
  const oc = assessOverallCounts();
  const obar = document.getElementById("assessOverallBarTake"); if(obar) obar.style.width = oc.pct+"%";
  const otxt = document.getElementById("assessOverallBarTakeTxt"); if(otxt) otxt.textContent = "Overall: "+oc.answered+" of "+oc.total+" ("+oc.pct+"%)";
}

function scheduleAssessAutosave(){
  const ind = document.getElementById("assessSaveIndicator"); if(ind) ind.textContent = "Saving…";
  clearTimeout(_assessSaveTimer);
  _assessSaveTimer = setTimeout(()=>{ saveAssessAssignment(); }, 1100);
}
async function saveAssessAssignment(statusOverride){
  if(!_assessCurrent) return false;
  if(!(await ensureFreshSession())){
    const ind = document.getElementById("assessSaveIndicator"); if(ind) ind.textContent = "Not saved — please log in again";
    return false;
  }
  const uid = state.profile.cloudSession.user_id;
  const newStatus = statusOverride || (_assessCurrent.status==="not_started" ? "in_progress" : _assessCurrent.status);
  const body = { user_id: uid, template_id: _assessCurrent.templateId, responses: _assessCurrent.responses, status: newStatus, updated_at: new Date().toISOString() };
  if(statusOverride==="submitted") body.submitted_at = new Date().toISOString();
  try{
    const res = await fetch(SB_ACCOUNTS_URL+"/rest/v1/assessment_assignments?on_conflict=user_id,template_id", {
      method:"POST",
      headers: Object.assign(acctHeaders(true), {Prefer:"resolution=merge-duplicates"}),
      body: JSON.stringify(body)
    });
    if(!res.ok){ const ind = document.getElementById("assessSaveIndicator"); if(ind) ind.textContent = "Save failed — check your connection"; return false; }
    _assessCurrent.status = newStatus;
    if(body.submitted_at) _assessCurrent.submittedAt = body.submitted_at;
    const row = (_assessCache||[]).find(r=>r.template_id===_assessCurrent.templateId);
    if(row){ row.responses = _assessCurrent.responses; row.status = newStatus; if(body.submitted_at) row.submitted_at = body.submitted_at; }
    const ind = document.getElementById("assessSaveIndicator"); if(ind) ind.textContent = "Saved ✓";
    return true;
  }catch(e){ const ind = document.getElementById("assessSaveIndicator"); if(ind) ind.textContent = "Save failed — check your connection"; return false; }
}
async function assessSubmitCurrent(){
  if(!_assessCurrent) return;
  if(assessBlockIncompleteSubmit(_assessCurrent.template, _assessCurrent.responses, "assess")) return;
  if(!confirm("Submit this assessment? You'll still be able to review your answers afterward, but they'll be marked complete.")) return;
  clearTimeout(_assessSaveTimer);
  const ok = await saveAssessAssignment("submitted");
  if(ok){ toast("Assessment submitted!"); render(); } else toast("Couldn't submit — check your connection and try again");
}

function openAssessmentTake(templateId){
  const row = (_assessCache||[]).find(r=>r.template_id===templateId);
  if(!row || !row.template){ toast("Couldn't load that assessment"); return; }
  _assessCurrent = {
    templateId, template: row.template,
    responses: JSON.parse(JSON.stringify(row.responses||{})),
    status: row.status||"not_started",
    submittedAt: row.submitted_at||null
  };
  _assessView = {mode:"take"};
  render();
}
function assessBackToList(){
  if(_assessCurrent && _assessCurrent.status!=="submitted"){
    clearTimeout(_assessSaveTimer);
    saveAssessAssignment();
  }
  _assessCurrent = null;
  _assessView = {mode:"list"};
  render();
}

/* ---- Drawing canvases (mouse / touch / pencil via Pointer Events) ---- */
function assessDrawStart(ev, canvas){
  if(canvas.hasAttribute("readonly")) return;
  ev.preventDefault();
  _assessDrawActive = true;
  const ctx = canvas.getContext("2d");
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  const x = (ev.clientX-rect.left)*scaleX, y = (ev.clientY-rect.top)*scaleY;
  canvas._lastX = x; canvas._lastY = y;
  ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.arc(x,y,1.3,0,Math.PI*2); ctx.fillStyle = "#1e293b"; ctx.fill();
}
function assessDrawMove(ev, canvas){
  if(!_assessDrawActive) return;
  ev.preventDefault();
  const ctx = canvas.getContext("2d");
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  const x = (ev.clientX-rect.left)*scaleX, y = (ev.clientY-rect.top)*scaleY;
  ctx.beginPath(); ctx.moveTo(canvas._lastX, canvas._lastY); ctx.lineTo(x,y); ctx.stroke();
  canvas._lastX = x; canvas._lastY = y;
}
function assessDrawEnd(ev, canvas){
  if(!_assessDrawActive) return;
  _assessDrawActive = false;
  const qid = canvas.getAttribute("data-qid");
  const zoneKey = canvas.getAttribute("data-zone")||"";
  captureAssessDrawing(canvas, qid, zoneKey);
}
function captureAssessDrawing(canvas, qid, zoneKey){
  if(!_assessCurrent) return;
  const dataUrl = canvas.toDataURL("image/png");
  if(zoneKey){
    const cur = _assessCurrent.responses[qid];
    const obj = (cur && typeof cur==="object" && !Array.isArray(cur)) ? cur : {};
    obj[zoneKey] = dataUrl;
    _assessCurrent.responses[qid] = obj;
  } else {
    _assessCurrent.responses[qid] = dataUrl;
  }
  scheduleAssessAutosave();
  updateAssessProgressUI();
}
function clearAssessDrawing(canvasId, qid, zoneKey){
  const canvas = document.getElementById(canvasId);
  if(canvas){
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  if(_assessCurrent){
    if(zoneKey){ const cur = _assessCurrent.responses[qid]; if(cur && typeof cur==="object") delete cur[zoneKey]; }
    else delete _assessCurrent.responses[qid];
    scheduleAssessAutosave();
    updateAssessProgressUI();
  }
}
function paintAssessCanvases(responses){
  if(!responses) return;
  document.querySelectorAll(".assess-canvas").forEach(canvas=>{
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
    const qid = canvas.getAttribute("data-qid");
    const zoneKey = canvas.getAttribute("data-zone")||"";
    let val = responses[qid];
    if(zoneKey && val && typeof val==="object") val = val[zoneKey];
    if(val && typeof val==="string" && val.indexOf("data:image")===0){
      const img = new Image();
      img.onload = ()=>{ ctx.drawImage(img,0,0,canvas.width,canvas.height); };
      img.src = val;
    }
  });
}
function initAssessCanvases(){ if(_assessCurrent) paintAssessCanvases(_assessCurrent.responses); }
function assessTextInput(el, qid){
  if(!_assessCurrent) return;
  _assessCurrent.responses[qid] = el.value;
  scheduleAssessAutosave();
  updateAssessProgressUI();
}

/* ---- Rendering ---- */
function renderAssessments(){
  if(!state.profile.cloudSession){
    return topbarHtml("📋 Assessments","Assigned by your Empowerment Specialist")+
      emptyState("🔒","Sign in to see your assessments","Assessments are tied to your account so your specialist can assign, track, and review them.")+
      '<button class="btn block" style="margin-top:14px;" data-action="openAccountForm" data-v="signup">Set up your account</button>'+
      '<button class="btn secondary block" style="margin-top:10px;" data-action="openAccountForm" data-v="login">I already have an account — Log in</button>';
  }
  if(_assessView.mode==="take" && _assessCurrent) return renderAssessTake();
  return renderAssessList();
}
function renderAssessList(){
  let html = topbarHtml("📋 Assessments","Assigned by your Empowerment Specialist");
  if(_assessCache===null){
    loadAssessAssignments().then(list=>{ _assessCache = list; render(); });
    return html + '<div class="empty card"><div class="big">⏳</div>Loading your assessments…</div>';
  }
  if(!_assessCache.length){
    return html + emptyState("📋","No assessments assigned yet","Once your specialist assigns one, it'll show up here.")+
      '<button class="btn secondary block" style="margin-top:14px;" data-action="refreshAssessList">↻ Refresh</button>';
  }
  const oc = assessOverallCounts();
  html += '<div class="assess-overall-card"><div style="font-weight:800;font-size:13.5px;margin-bottom:6px;">Overall Progress</div>'+
    '<div class="progress-bar"><div style="width:'+oc.pct+'%;"></div></div>'+
    '<div style="font-size:12px;margin-top:6px;opacity:.9;">'+oc.answered+' of '+oc.total+' questions answered ('+oc.pct+'%)</div></div>';
  html += _assessCache.map(row=>{
    const tmpl = row.template || {};
    const c = assessCountsForTemplateResponses(tmpl, row.responses||{});
    const pct = c.total ? Math.round(c.answered/c.total*100) : 0;
    const status = row.status || "not_started";
    const statusLabel = status==="submitted" ? "Submitted" : (status==="in_progress" ? "In progress" : "Not started");
    const btnLabel = status==="submitted" ? "Review" : (status==="in_progress" ? "Continue" : "Start");
    return '<div class="habit-card" style="align-items:flex-start;">'+
      '<div class="emoji-badge" style="background:var(--surface-2);">📋</div>'+
      '<div class="hc-body" style="flex:1;">'+
      '<div class="hc-title">'+escapeHtml(tmpl.title||"Assessment")+' <span class="assess-status-pill '+status+'">'+statusLabel+'</span></div>'+
      (tmpl.description?'<div class="hc-meta">'+escapeHtml(tmpl.description)+'</div>':'')+
      '<div class="progress-bar" style="margin-top:8px;"><div style="width:'+pct+'%;"></div></div>'+
      '<div class="hc-meta" style="margin-top:4px;">'+c.answered+' of '+c.total+' answered</div>'+
      '</div>'+
      '<button class="btn secondary sm" data-action="assessOpenTake" data-id="'+tmpl.id+'">'+btnLabel+' ›</button>'+
      '</div>';
  }).join("");
  html += '<button class="btn secondary block" style="margin-top:10px;" data-action="refreshAssessList">↻ Refresh</button>';
  return html;
}
function assessQuestionHtml(si, qi, q, responses, readonly, prefix){
  prefix = prefix || "assess";
  const qid = "s"+si+"_q"+qi;
  const val = responses[qid];
  if(q.type==="info"){
    return '<div class="assess-info-card">☕ '+escapeHtml(q.prompt||"")+'</div>';
  }
  let inner = "";
  if(q.type==="single_choice"){
    inner = '<div class="assess-opts">'+(q.options||[]).map((opt,oi)=>{
      const label = typeof opt==="string" ? opt : (opt.label||"");
      const sub = (typeof opt==="object" && opt && opt.sub) ? '<div style="font-size:11.5px;font-weight:500;color:var(--text-muted);margin-top:2px;">'+escapeHtml(opt.sub)+'</div>' : "";
      const sel = val===oi;
      const tag = readonly ? "div" : "button";
      const attrs = readonly ? "" : ' data-action="'+prefix+'Pick" data-id="'+qid+'" data-v="'+oi+'"';
      return '<'+tag+' type="button" class="assess-opt'+(sel?" selected":"")+(readonly?" readonly":"")+'"'+attrs+'>'+escapeHtml(label)+sub+'</'+tag+'>';
    }).join("")+'</div>';
  } else if(q.type==="versus"){
    const opts = q.options||["",""];
    const tag = readonly ? "div" : "button";
    inner = '<div class="assess-vs-row">'+
      [0,1].map(oi=>{
        const sel = val===oi;
        const attrs = readonly ? "" : ' data-action="'+prefix+'Pick" data-id="'+qid+'" data-v="'+oi+'"';
        return '<'+tag+' type="button" class="assess-opt'+(sel?" selected":"")+(readonly?" readonly":"")+'"'+attrs+'>'+escapeHtml(opts[oi]||"")+'</'+tag+'>';
      }).join('<div class="assess-vs-divider">VS</div>')+
      '</div>';
    inner += (()=>{
      const sel = val===2;
      const attrs = readonly ? "" : ' data-action="'+prefix+'Pick" data-id="'+qid+'" data-v="2"';
      return '<'+tag+' type="button" class="assess-opt'+(sel?" selected":"")+(readonly?" readonly":"")+'" style="margin-top:8px;text-align:center;"'+attrs+'>🤝 Both relate to me</'+tag+'>';
    })();
  } else if(q.type==="checklist"){
    const arr = Array.isArray(val) ? val : [];
    inner = (q.options||[]).map((opt,oi)=>{
      const sel = arr.indexOf(oi)>-1;
      const attrs = readonly ? "" : ' data-action="'+prefix+'ToggleCheck" data-id="'+qid+'" data-v="'+oi+'"';
      return '<div class="assess-check-row'+(sel?" selected":"")+'"'+attrs+'><div class="assess-check-box">'+(sel?"✓":"")+'</div><div style="font-size:13px;flex:1;">'+escapeHtml(opt)+'</div></div>';
    }).join("");
  } else if(q.type==="text"){
    const escVal = escapeHtml(val||"");
    const disAttr = readonly ? " readonly" : "";
    if(q.multiline){
      inner = '<textarea style="width:100%;min-height:90px;border:1.5px solid var(--border);border-radius:12px;padding:12px;font-size:13.5px;background:var(--surface);color:var(--text);'+(readonly?"opacity:.75;":"")+'"'+disAttr+' oninput="'+prefix+'TextInput(this,\''+qid+'\')" placeholder="Type your answer…">'+escVal+'</textarea>';
    } else {
      inner = '<input type="text" style="width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px;font-size:13.5px;background:var(--surface);color:var(--text);'+(readonly?"opacity:.75;":"")+'"'+disAttr+' value="'+escVal+'" oninput="'+prefix+'TextInput(this,\''+qid+'\')" placeholder="Type your answer…">';
    }
  } else if(q.type==="drawing"){
    const zones = (q.zones && q.zones.length) ? q.zones : [null];
    inner = zones.map((z,zi)=>{
      const zoneKey = z||"";
      const canvasId = "dcv_"+qid+"_"+zi;
      const clearBtn = readonly ? "" : '<button type="button" class="assess-canvas-clear" data-action="'+prefix+'ClearDrawing" data-id="'+canvasId+'" data-qid="'+qid+'" data-zone="'+escapeHtml(zoneKey)+'">Clear</button>';
      const ptrAttrs = readonly ? " readonly" :
        ' onpointerdown="'+prefix+'DrawStart(event,this)" onpointermove="'+prefix+'DrawMove(event,this)" onpointerup="'+prefix+'DrawEnd(event,this)" onpointerleave="'+prefix+'DrawEnd(event,this)" onpointercancel="'+prefix+'DrawEnd(event,this)"';
      return (z?'<div class="assess-zone-label">'+escapeHtml(z)+'</div>':"")+
        '<div class="assess-canvas-wrap">'+clearBtn+
        '<canvas id="'+canvasId+'" class="assess-canvas" width="600" height="260" data-qid="'+qid+'" data-zone="'+escapeHtml(zoneKey)+'"'+ptrAttrs+'></canvas>'+
        '</div>';
    }).join("");
  }
  return '<div class="assess-q-card" id="qcard_'+prefix+'_'+qid+'">'+(q.prompt?'<div class="assess-q-prompt">'+escapeHtml(q.prompt)+'</div>':"")+inner+'</div>';
}
function renderAssessTake(){
  const c = _assessCurrent;
  const tmpl = c.template;
  const readonly = c.status==="submitted";
  const counts = assessCountsForTemplateResponses(tmpl, c.responses);
  const pct = counts.total ? Math.round(counts.answered/counts.total*100) : 0;
  const oc = assessOverallCounts();
  const submittedLabel = c.submittedAt ? (" "+fmtDatePretty(c.submittedAt.slice(0,10))) : "";
  let html = '<div class="topbar"><div><h1>'+escapeHtml(tmpl.title||"Assessment")+'</h1>'+
    (tmpl.description?'<p class="subtitle" style="margin:2px 0 0">'+escapeHtml(tmpl.description)+'</p>':"")+'</div>'+
    '<button class="btn secondary sm" data-action="assessBackToList">‹ Back</button></div>';
  html += '<div class="card" style="margin-bottom:14px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--text-muted);"><span id="assessSelfBarTxt">'+counts.answered+' of '+counts.total+' answered ('+pct+'%)</span>'+
    (readonly?'<span class="assess-status-pill submitted">Submitted'+submittedLabel+'</span>':"")+'</div>'+
    '<div class="progress-bar" style="margin-top:6px;"><div id="assessSelfBar" style="width:'+pct+'%;"></div></div>'+
    '<div style="font-size:11px;color:var(--text-muted);margin-top:10px;" id="assessOverallBarTakeTxt">Overall: '+oc.answered+' of '+oc.total+' ('+oc.pct+'%)</div>'+
    '<div class="progress-bar" style="margin-top:4px;height:6px;"><div id="assessOverallBarTake" style="width:'+oc.pct+'%;"></div></div>'+
    '</div>';
  (tmpl.sections||[]).forEach((sec,si)=>{
    if(sec.deleted) return;
    html += '<div class="section-head"><h2>'+escapeHtml(sec.title||"")+'</h2></div>';
    if(sec.instructions) html += '<p class="hc-meta" style="margin:-6px 0 10px;">'+escapeHtml(sec.instructions)+'</p>';
    (sec.questions||[]).forEach((q,qi)=>{ if(!q.deleted) html += assessQuestionHtml(si,qi,q,c.responses,readonly); });
  });
  if(!readonly){
    html += '<div class="assess-sticky-bar"><div id="assessSaveIndicator" class="assess-save-indicator">Autosaves as you go</div>'+
      '<button class="btn block" data-action="assessSubmit">✅ Submit Assessment</button></div>';
  } else {
    html += '<button class="btn secondary block" style="margin-top:10px;" data-action="assessBackToList">‹ Back to Assessments</button>';
  }
  return html;
}

function bootApp(){
  setupPwaMeta();
  const profiles = loadProfiles();
  const curId = getCurrentProfileId();
  if(curId && profiles.find(p=>p.id===curId)){
    activateProfile(curId); render();
  } else if(profiles.length===1 && !profiles[0].pin && profiles[0].id!==DEMO_PROFILE_ID){
    activateProfile(profiles[0].id); render();
  } else {
    renderProfilePicker();
  }
}

function isHabitDueOn(habit, dateStr){
  if(habit.frequency === "daily") return true;
  if(habit.frequency === "weekdays"){ const dn = dayOfWeekName(dateStr); return dn!=="Sat" && dn!=="Sun"; }
  if(habit.frequency === "weekly") return true;
  if(habit.frequency === "custom") return (habit.custom_days||[]).includes(dayOfWeekName(dateStr));
  return true;
}
function isHabitCompletedOn(habit, dateStr){ return state.habitLogs.some(l=>l.habit_id===habit.id && l.completed_date===dateStr); }

function expectedDatesDesc(habit, limit){
  const dates = [];
  let cur = todayStr();
  let guard = 0;
  while(dates.length < limit && guard < 1000){
    guard++;
    if(habit.frequency === "weekly"){ dates.push(cur); }
    else if(isHabitDueOn(habit, cur)){ dates.push(cur); }
    cur = addDays(cur, -1);
  }
  return dates;
}
function computeStreaks(habit){
  if(habit.frequency === "weekly"){
    const logs = logsForHabit(habit.id).map(l=>l.completed_date).sort();
    if(logs.length===0) return {current:0,best:0};
    function weekKey(dateStr){
      const [y,m,d] = dateStr.split("-").map(Number);
      const dt = new Date(y,m-1,d);
      const day = (dt.getDay()+6)%7;
      dt.setDate(dt.getDate()-day);
      return todayStr(dt);
    }
    const weeksSet = new Set(logs.map(weekKey));
    const weeks = Array.from(weeksSet).sort();
    let best=1, run=1;
    for(let i=1;i<weeks.length;i++){
      const diffDays = Math.round((new Date(weeks[i]) - new Date(weeks[i-1]))/86400000);
      if(diffDays===7){ run++; } else { run=1; }
      best = Math.max(best, run);
    }
    const thisWeek = weekKey(todayStr());
    const lastWeek = addDays(thisWeek,-7);
    let current = 0;
    if(weeksSet.has(thisWeek) || weeksSet.has(lastWeek)){
      let wk = weeksSet.has(thisWeek) ? thisWeek : lastWeek;
      while(weeksSet.has(wk)){ current++; wk = addDays(wk,-7); }
    }
    return {current, best};
  }
  const expected = expectedDatesDesc(habit, 400);
  let current = 0, startIdx = 0;
  if(expected.length && expected[0]===todayStr() && !isHabitCompletedOn(habit, expected[0])) startIdx = 1;
  for(let i=startIdx;i<expected.length;i++){
    if(isHabitCompletedOn(habit, expected[i])) current++; else break;
  }
  const ascending = expected.slice().reverse();
  let best=0, run=0;
  for(const d of ascending){
    if(isHabitCompletedOn(habit,d)){ run++; best=Math.max(best,run); } else { run=0; }
  }
  best = Math.max(best, current);
  return {current, best};
}
function totalPoints(s){ s = s || state; return s.habitLogs.reduce((sum,l)=>sum+(l.points_earned||0),0) + s.focusSessions.filter(f=>f.status==="completed").length*15; }
function habitsDueToday(){ return state.habits.filter(h=>h.is_active!==false && isHabitDueOn(h, todayStr())); }

/* ============ Schedule templates / effective time ============ */
function getTemplateForDate(dateStr){
  if(isPlannerHoliday(dateStr)) return null; // holidays/breaks/days off suppress the assigned day template
  const dp = state.dayPlans.find(x=>x.date===dateStr);
  if(dp){
    // An explicit one-off assignment for this exact date always wins — including a
    // "skip" marker (template_id:null) used to override a recurring rule for one day.
    return dp.template_id ? (state.scheduleTemplates.find(t=>t.id===dp.template_id) || null) : null;
  }
  const rule = templateRuleForDate(dateStr);
  if(rule) return state.scheduleTemplates.find(t=>t.id===rule.template_id) || null;
  return null;
}
/* Recurring weekly rule (if any) that covers this date, respecting its optional start/end range. */
function templateRuleForDate(dateStr){
  return (state.templateRules||[]).find(r=>{
    if(r.startDate && dateStr < r.startDate) return false;
    if(r.endDate && dateStr > r.endDate) return false;
    return (r.days||[]).includes(weekdayIndexOf(dateStr));
  }) || null;
}
function getEffectiveReminderTime(reminder, dateStr){
  const template = getTemplateForDate(dateStr);
  if(template){
    let block = (template.time_blocks||[]).find(b=>b.type==="reminder" && b.reminder_id===reminder.id);
    if(!block && reminder.habit_id) block = (template.time_blocks||[]).find(b=>b.type==="habit" && b.habit_id===reminder.habit_id);
    if(block && block.time) return block.time;
  }
  return reminder.time;
}
function getVirtualEventAlarms(dateStr){
  const tmpl = getTemplateForDate(dateStr);
  if(!tmpl) return [];
  return (tmpl.time_blocks||[]).filter(b=>b.type==="event" && b.alarm_enabled && b.time).map(b=>({
    id:"evt_"+tmpl.id+"_"+b.id, title:b.label||"Scheduled item", time:b.time,
    alarm_level:b.alarm_level||"moderate", message:"", days:[dayOfWeekName(dateStr)], is_active:true
  }));
}
function getCustomEventAlarms(dateStr){
  return (state.customEvents||[]).filter(e=>eventOccursOnDate(e,dateStr) && e.alarm_enabled && e.time).map(e=>({
    id:"cevt_"+e.id, title:e.label||"Event", time:e.time,
    alarm_level:e.alarm_level||"moderate", message:e.description||"", days:[dayOfWeekName(dateStr)], is_active:true
  }));
}
/* Epoch day number for a Y-M-D date string — used for interval math in custom recurrence. */
function dateToEpochDay(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  return Math.round(new Date(y,m-1,d).getTime()/86400000);
}
/* Whether a (possibly repeating) custom event occurs on a given date. */
function eventOccursOnDate(ev, dateStr){
  if(!ev || !ev.date) return false;
  if(dateStr < ev.date) return false;
  if(ev.repeat_until && dateStr > ev.repeat_until) return false;
  const repeat = ev.repeat || "none";
  if(repeat==="none") return ev.date===dateStr;
  if(repeat==="daily") return true;
  if(repeat==="weekly"){
    const days = (ev.repeat_days && ev.repeat_days.length) ? ev.repeat_days : [weekdayIndexOf(ev.date)];
    return days.includes(weekdayIndexOf(dateStr));
  }
  if(repeat==="monthly"){
    const day1 = Number(ev.date.split("-")[2]);
    const day2 = Number(dateStr.split("-")[2]);
    return day1===day2;
  }
  if(repeat==="custom"){
    const interval = Math.max(1, Number(ev.repeat_interval)||1);
    const unit = ev.repeat_unit || "week";
    if(unit==="day"){
      return (dateToEpochDay(dateStr) - dateToEpochDay(ev.date)) % interval === 0;
    }
    if(unit==="week"){
      const days = (ev.repeat_days && ev.repeat_days.length) ? ev.repeat_days : [weekdayIndexOf(ev.date)];
      if(!days.includes(weekdayIndexOf(dateStr))) return false;
      const startWeekBase = dateToEpochDay(ev.date) - weekdayIndexOf(ev.date);
      const targetWeekBase = dateToEpochDay(dateStr) - weekdayIndexOf(dateStr);
      return ((targetWeekBase - startWeekBase) / 7) % interval === 0;
    }
    if(unit==="month"){
      const [y1,m1,d1] = ev.date.split("-").map(Number);
      const [y2,m2,d2] = dateStr.split("-").map(Number);
      if(d1!==d2) return false;
      return ((y2-y1)*12 + (m2-m1)) % interval === 0;
    }
    return ev.date===dateStr;
  }
  return ev.date===dateStr;
}
/* ============ Class Schedule — Fixed / Week Rotation / Day Rotation ============ */
function weekdayIndexOf(dateStr){ const [y,m,d]=dateStr.split("-").map(Number); return new Date(y,m-1,d).getDay(); }
function periodTimesFor(sem){
  // Legacy helper — only used to migrate old uniform-period-time semesters into per-class time slots.
  const count = sem.periodsPerDay||6;
  const [sh,sm] = (sem.defaultStartTime||"08:00").split(":").map(Number);
  let mins = (sh||0)*60+(sm||0);
  const dur = sem.periodMinutes||50, gap = sem.passingMinutes==null?5:sem.passingMinutes;
  const times = [];
  for(let i=0;i<count;i++){
    const h = Math.floor(mins/60)%24, mm = mins%60;
    times.push(String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0"));
    mins += dur+gap;
  }
  return times;
}
function migrateSemesterToClassSubjects(sem){
  if(!sem.scheduleType) sem.scheduleType = "day_rotation";
  if(!sem.terms) sem.terms = [];
  if(sem.classSubjects) return;
  const classSubjects = [];
  if(sem.classes){
    const times = periodTimesFor(sem);
    Object.keys(sem.classes).forEach(letter=>{
      (sem.classes[letter]||[]).forEach((subj,i)=>{
        const name = (subj||"").trim();
        if(!name) return;
        classSubjects.push({ id: uid(), name, color: COLORS[classSubjects.length % COLORS.length], slots: [{ id: uid(), dayKey: letter, time: times[i]||"09:00", duration: sem.periodMinutes||50, dateRangeMode:"none", termId:null, startDate:null, endDate:null }] });
      });
    });
  }
  sem.classSubjects = classSubjects;
}
function getSemesters(){ const list = state.semesters || (state.semesters=[]); list.forEach(migrateSemesterToClassSubjects); return list; }
function activeSemester(){ return getSemesters().find(s=>s.id===state.activeSemesterId) || null; }
function semesterForDate(dateStr){
  const active = activeSemester();
  if(active && dateStr>=active.startDate && dateStr<=active.endDate) return active;
  return getSemesters().find(s=>dateStr>=s.startDate && dateStr<=s.endDate) || null;
}
function isSchoolWeekday(sem, dateStr){ return (sem.activeWeekdays||[1,2,3,4,5]).includes(weekdayIndexOf(dateStr)); }
/* Planner-wide holidays/breaks/days off — one shared list used by both the block rotation and day templates. */
function getPlannerHoliday(dateStr){ return (state.plannerHolidays||[]).find(h=>dateStr>=h.startDate && dateStr<=h.endDate) || null; }
function isPlannerHoliday(dateStr){ return !!getPlannerHoliday(dateStr); }
function isHolidayDate(sem, dateStr){ return isPlannerHoliday(dateStr); }
function plannerHolidayBadgeHtml(dateStr, size){

}
const WEEKDAY_KEY_NAMES = {0:"Sun",1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat"};
function dayKeyOptions(sem){
  if(sem.scheduleType==="fixed"){
    return [1,2,3,4,5,6,0].filter(wd=>(sem.activeWeekdays||[1,2,3,4,5]).includes(wd)).map(wd=>({key:String(wd), label:WEEKDAY_KEY_NAMES[wd]}));
  }
  const n = sem.rotationLength||4;
  return Array.from({length:n},(_,i)=>{ const l = String.fromCharCode(65+i); return {key:l, label:l}; });
}
function dayKeyLabel(sem, dayKey){
  if(dayKey==null) return null;
  if(sem.scheduleType==="fixed") return WEEKDAY_KEY_NAMES[Number(dayKey)]||dayKey;
  if(sem.scheduleType==="week_rotation") return dayKey+" Week";
  return dayKey+" Day";
}
function scheduleTypeHint(type){
  if(type==="fixed") return "Same schedule every week — classes are tied to a day of the week, no rotation.";
  if(type==="week_rotation") return "Whole weeks alternate (e.g. \"A Week\", \"B Week\") — classes are tied to which week it is. Holidays don't consume a week.";
  return "Classes rotate day by day (A, B, C, D…) — classes are tied to the rotation day. Weekends and holidays don't consume a day.";
}
function mondayOf(dateStr){ const dow = weekdayIndexOf(dateStr); const offset = dow===0 ? -6 : (1-dow); return addDays(dateStr, offset); }
function weekHasSchoolDay(sem, mondayDateStr){
  for(let i=0;i<7;i++){ const d = addDays(mondayDateStr, i); if(d>sem.endDate) break; if(isSchoolWeekday(sem,d) && !isHolidayDate(sem,d)) return true; }
  return false;
}
function getScheduleDayKey(sem, dateStr){
  if(sem.scheduleType==="fixed") return String(weekdayIndexOf(dateStr));
  const n = sem.rotationLength||4;
  if(sem.scheduleType==="week_rotation"){
    const startWeekMonday = mondayOf(sem.startDate), dateWeekMonday = mondayOf(dateStr);
    let count = 0, cur = startWeekMonday;
    while(cur < dateWeekMonday){ if(weekHasSchoolDay(sem, cur)) count++; cur = addDays(cur, 7); }
    const idx = ((sem.startLetterIndex||0) + count) % n;
    return String.fromCharCode(65+idx);
  }
  // day_rotation — holidays are skipped entirely from the count, so the letter sequence "bumps" forward
  // onto the next real school day instead of being consumed by the day off.
  let count = 0, cur = sem.startDate;
  while(cur < dateStr){ if(isSchoolWeekday(sem, cur) && !isHolidayDate(sem, cur)) count++; cur = addDays(cur, 1); }
  const idx = ((sem.startLetterIndex||0) + count) % n;
  return String.fromCharCode(65+idx);
}
function classDateRangeCovers(sem, slot, dateStr){
  if(slot.dateRangeMode==="manual"){
    return (!slot.startDate || dateStr>=slot.startDate) && (!slot.endDate || dateStr<=slot.endDate);
  }
  if(slot.dateRangeMode==="term" && slot.termId){
    const term = (sem.terms||[]).find(t=>t.id===slot.termId);
    if(term) return dateStr>=term.startDate && dateStr<=term.endDate;
  }
  return true;
}
function classesForDayKey(sem, dayKey, dateStr){
  const list = [];
  (sem.classSubjects||[]).forEach(cls=>{
    if(!cls.name || !cls.name.trim()) return;
    (cls.slots||[]).forEach(slot=>{
      if(String(slot.dayKey)!==String(dayKey)) return;
      if(dateStr<sem.startDate || dateStr>sem.endDate) return;
      if(!classDateRangeCovers(sem, slot, dateStr)) return;
      list.push({subject:cls.name.trim(), time:slot.time||"", duration:slot.duration||30, classId:cls.id, slotId:slot.id, color:cls.color||COLORS[0]});
    });
  });
  list.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
  return list;
}
function getScheduleDayInfo(dateStr){
  const override = (state.scheduleOverrides||{})[dateStr];
  const sem = semesterForDate(dateStr);
  if(override){
    const effSem = sem || activeSemester();
    if(override.mode==="custom"){
      const classes = (override.classes||[]).filter(c=>c.subject&&c.subject.trim());
      return {semester:effSem, dayKey:null, letter:null, dayLabel:null, noSchool:false, reason:null, classes, overridden:true, overrideLabel:override.label||"Custom Schedule"};
    }
    if(override.mode==="letter" && effSem){
      const classes = classesForDayKey(effSem, override.letter, dateStr);
      return {semester:effSem, dayKey:override.letter, letter:override.letter, dayLabel:dayKeyLabel(effSem, override.letter), noSchool:false, reason:null, classes, overridden:true};
    }
  }
  if(!sem) return null;
  if(!isSchoolWeekday(sem, dateStr)) return {semester:sem, dayKey:null, letter:null, dayLabel:null, noSchool:true, reason:"weekend", classes:[]};
  if(isHolidayDate(sem, dateStr)) return {semester:sem, dayKey:null, letter:null, dayLabel:null, noSchool:true, reason:"holiday", classes:[]};
  const dayKey = getScheduleDayKey(sem, dateStr);
  const classes = classesForDayKey(sem, dayKey, dateStr);
  return {semester:sem, dayKey, letter: sem.scheduleType==="fixed"?null:dayKey, dayLabel: dayKeyLabel(sem,dayKey), noSchool:false, reason:null, classes};
}
function dayLetterBadgeHtml(dateStr, size){
  const info = getScheduleDayInfo(dateStr);
  if(!info) return "";
  if(info.noSchool){
    return info.reason==="holiday" ? '<span class="tag" style="background:var(--surface-2);'+(size==="sm"?"font-size:9px;padding:2px 7px;":"")+'">No School</span>' : "";
  }
  const label = info.dayLabel ? (info.dayLabel+(info.overridden?" (swapped)":"")) : (info.overrideLabel||"Custom Schedule");
  return '<span class="tag" style="background:var(--accent);color:#fff;'+(size==="sm"?"font-size:9px;padding:2px 7px;":"")+'">'+escapeHtml(label)+'</span>';
}
function getDayTimelineItems(dateStr){
  const template = getTemplateForDate(dateStr);
  const items = [];
  if(template){
    (template.time_blocks||[]).forEach(b=>{
      if(b.type==="habit"){
        const h = state.habits.find(x=>x.id===b.habit_id);
        if(h) items.push({time:b.time, label:b.label||h.title, emoji:h.emoji, type:"habit", id:h.id, done:isHabitCompletedOn(h,dateStr), duration:b.duration_minutes, color:h.color});
      } else if(b.type==="reminder"){
        const r = state.reminders.find(x=>x.id===b.reminder_id);
        if(r) items.push({time:b.time, label:b.label||r.title, emoji:"⏰", type:"reminder", id:r.id, duration:b.duration_minutes, color:r.color});
      } else {
        items.push({time:b.time, label:b.label||"Scheduled item", emoji:b.alarm_enabled?"🔔":"📌", type:"event", duration:b.duration_minutes});
      }
    });
    const coveredHabitIds = new Set((template.time_blocks||[]).filter(b=>b.type==="habit").map(b=>b.habit_id));
    const coveredReminderIds = new Set((template.time_blocks||[]).filter(b=>b.type==="reminder").map(b=>b.reminder_id));
    state.habits.filter(h=>h.is_active!==false && isHabitDueOn(h,dateStr) && !coveredHabitIds.has(h.id)).forEach(h=>items.push({time:"", label:h.title, emoji:h.emoji, type:"habit", id:h.id, done:isHabitCompletedOn(h,dateStr), color:h.color}));
    state.reminders.filter(r=>r.is_active!==false && (r.days||[]).includes(dayOfWeekName(dateStr)) && !coveredReminderIds.has(r.id)).forEach(r=>items.push({time:r.time, label:r.title, emoji:"⏰", type:"reminder", id:r.id, color:r.color}));
  } else {
    state.habits.filter(h=>h.is_active!==false && isHabitDueOn(h,dateStr)).forEach(h=>items.push({time:"", label:h.title, emoji:h.emoji, type:"habit", id:h.id, done:isHabitCompletedOn(h,dateStr), color:h.color}));
    state.reminders.filter(r=>r.is_active!==false && (r.days||[]).includes(dayOfWeekName(dateStr))).forEach(r=>items.push({time:r.time, label:r.title, emoji:"⏰", type:"reminder", id:r.id, color:r.color}));
  }
  (state.customEvents||[]).filter(e=>eventOccursOnDate(e,dateStr)).forEach(e=>items.push({time:e.time||"", label:e.label+(e.repeat&&e.repeat!=="none"?" 🔁":""), emoji:e.emoji||(e.alarm_enabled?"🔔":"📌"), type:"custom_event", id:e.id, duration:e.duration_minutes, color:e.color}));
  const sched = getScheduleDayInfo(dateStr);
  if(sched && !sched.noSchool){
    sched.classes.forEach(c=>items.push({time:c.time, label:c.subject, emoji:"📚", type:"class_period", letter:sched.letter, overrideLabel:sched.overrideLabel, duration:c.duration||30, color:c.color}));
  }
  (state.tasks||[]).filter(t=>t.date===dateStr).forEach(t=>{
    const link = taskLinkedInfo(t);
    items.push({time:"", label:t.title, emoji:"📝", type:"task", id:t.id, done:t.status==="done", color:t.color, duration:t.planned_minutes, linkLabel: link?link.label:null});
  });
  items.sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
  return items;
}

function effectiveTheme(){
  if(state.profile.theme==="auto"){
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  return state.profile.theme || "light";
}

  document.body.setAttribute("data-theme", effectiveTheme());
  const accent = state.profile.accent || "#2563EB";
  const accent2 = state.profile.accent2 || "#14B8A6";
  document.documentElement.style.setProperty("--accent", accent);
  document.documentElement.style.setProperty("--accent2", accent2);
  const [r,g,b] = hexToRgb(accent);
  document.documentElement.style.setProperty("--accent-rgb", r+","+g+","+b);
  document.documentElement.style.setProperty("--app-font", currentTheme().font);

      message: document.getElementById("habit_alarmMsg").value.trim(),

function monthCalendarHtml(monthCursor, selectedDate, navAction, clickAction, expandable, richView){
  const [y,m] = monthCursor.split("-").map(Number);
  const firstOfMonth = y+"-"+String(m).padStart(2,"0")+"-01";
  const firstDow = new Date(y,m-1,1).getDay();
  const mondayOffset = (firstDow+6)%7;
  const gridStart = addDays(firstOfMonth, -mondayOffset);
  const monLabels = ["Mo","Tu","We","Th","Fr","Sa","Su"];
  let html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'+
    '<div style="font-weight:800;font-size:17px;">'+new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</div>'+
    '<div style="display:flex;gap:6px;"><button class="icon-btn" data-action="'+navAction+'" data-v="-1">‹</button><button class="icon-btn" data-action="'+navAction+'" data-v="1">›</button></div></div>';
  html += '<div class="cal-grid">'+monLabels.map(l=>'<div class="cal-daylabel">'+l+'</div>').join("")+'</div><div class="cal-grid">';
  const maxChips = 3;
  for(let i=0;i<42;i++){
    const d2 = addDays(gridStart, i);
    const inMonth = d2.slice(0,7)===monthCursor;
    const dnum = Number(d2.slice(8,10));
    const isToday = d2===todayStr();
    const isSelected = d2===selectedDate;
    const rotInfo = inMonth ? getScheduleDayInfo(d2) : null;
    const rotLetter = (rotInfo && !rotInfo.noSchool) ? rotInfo.letter : "";
    if(richView){
      const items = inMonth ? getDayTimelineItems(d2) : [];
      const chips = items.slice(0,maxChips).map(it=>'<div class="cal-chip" style="'+(it.color?"background:"+it.color+"33;":"")+(it.done?"opacity:.55;text-decoration:line-through;":"")+'">'+(it.emoji||"•")+' '+escapeHtml(it.label||"")+'</div>').join("");
      const moreCount = items.length - maxChips;
      html += '<div class="cal-cell rich '+(inMonth?"":"dim")+' '+(isToday&&!isSelected?"today":"")+' '+(isSelected?"selected":"")+'" data-action="'+clickAction+'" data-v="'+d2+'">'+
        (expandable?'<div class="expand-ic" data-action="expandDayPreview" data-v="'+d2+'" title="Preview this day">🔍</div>':"")+
        '<div class="cal-daynum">'+dnum+(rotLetter?' <span style="font-size:9px;font-weight:800;color:var(--accent);">'+rotLetter+'</span>':'')+'</div>'+
        chips+(moreCount>0?'<div class="cal-more">+'+moreCount+' more</div>':'')+
        '</div>';
    } else {
      const hasCompletion = state.habitLogs.some(l=>l.completed_date===d2);
      html += '<div class="cal-cell '+(inMonth?"":"dim")+' '+(isToday&&!isSelected?"today":"")+' '+(isSelected?"selected":"")+'" data-action="'+clickAction+'" data-v="'+d2+'">'+
        (expandable?'<div class="expand-ic" data-action="expandDayPreview" data-v="'+d2+'" title="Preview this day">🔍</div>':"")+
        dnum+(hasCompletion&&!isSelected?'<div class="dot"></div>':'')+
        (rotLetter?'<div style="font-size:9px;font-weight:800;color:var(--accent);margin-top:1px;">'+rotLetter+'</div>':'')+'</div>';
    }
  }
  html += '</div>';
  return html;
}

  document.querySelectorAll("#classSlotList [data-slotrow]").forEach(row=>{

    const s = classFormSlots[idx];
    const timeEl = row.querySelector(".cs_time"); if(timeEl) s.time = timeEl.value;
    const durEl = row.querySelector(".cs_dur"); if(durEl) s.duration = Number(durEl.value)||50;
    const termEl = row.querySelector(".cs_term"); if(termEl) s.termId = termEl.value;
    const startEl = row.querySelector(".cs_start"); if(startEl) s.startDate = startEl.value;
    const endEl = row.querySelector(".cs_end"); if(endEl) s.endDate = endEl.value;
  });
}

function renderLineChart(days, color){
  const w=600,h=140,pad=26;
  const max = Math.max(1, ...days.map(d=>d.value));
  const stepX = (w-pad*2)/((days.length-1)||1);
  const pts = days.map((d,i)=>{ const x=pad+i*stepX; const y=h-pad-((d.value/max)*(h-pad*2)); return [x,y]; });
  const path = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const dots = pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+color+'"></circle>').join("");
  const everyN = Math.max(1,Math.ceil(days.length/6));
  const labels = days.map((d,i)=> i%everyN===0 ? '<text x="'+pts[i][0].toFixed(1)+'" y="'+(h-6)+'" font-size="9" fill="var(--text-muted)" text-anchor="middle">'+d.label+'</text>' : "").join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:140px;"><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+labels+'</svg>';
}

function buildPomodoroPhases(workMin, shortMin, longMin, cycles){

  phases.push({type:"break", minutes:longMin, long:true});
  return phases;
}

function checkBrainInterrupt(session){
  if(!state.profile.brainInterruptEnabled) return;
  if(document.getElementById("alarmOverlay")) return;
  const isWorkPhase = session.mode==="pomodoro" ? (session.phases[session.phaseIndex] && session.phases[session.phaseIndex].type==="work") : true;
  if(!isWorkPhase) return;
  const intervalMs = Math.max(1, Number(state.profile.brainInterruptMinutes)||10) * 60000;
  const fallbackStart = session.mode==="pomodoro" ? session.phaseStartTime : session.start_time;
  const last = session.lastBrainInterruptAt || fallbackStart;
  if(Date.now() - new Date(last).getTime() >= intervalMs){
    session.lastBrainInterruptAt = new Date().toISOString();
    saveState();
    fireAlarm({id:"brain_"+session.id+"_"+Date.now(), title:"🧠 Stay Focused!", message:"Are you staying focused? Get back on track!", alarm_level: state.profile.brainInterruptLevel||"gentle"});
  }
}
function startFocusTicker(session){
  if(focusTimer) clearInterval(focusTimer);
  let checkinShown = false;
  function tick(){
    const el = document.getElementById("focusTimeDisplay");
    if(!el) { clearInterval(focusTimer); return; }
    checkBrainInterrupt(session);
    if(session.mode==="pomodoro"){
      const phase = session.phases[session.phaseIndex];
      if(!phase){ clearInterval(focusTimer); return; }
      const start = new Date(session.phaseStartTime).getTime();
      const totalMs = phase.minutes*60000;
      const remain = Math.max(0, start+totalMs-Date.now());
      const mm = String(Math.floor(remain/60000)).padStart(2,"0");
      const ss = String(Math.floor((remain%60000)/1000)).padStart(2,"0");
      el.textContent = mm+":"+ss;
      if(remain<=0){
        advancePomodoroPhase(session);
      }
      return;
    }
    const start = new Date(session.start_time).getTime();
    const totalMs = session.duration_minutes*60000;
    const remain = Math.max(0, start+totalMs-Date.now());
    const mm = String(Math.floor(remain/60000)).padStart(2,"0");
    const ss = String(Math.floor((remain%60000)/1000)).padStart(2,"0");
    el.textContent = mm+":"+ss;
    if(!checkinShown && remain <= totalMs/2 && remain > 0){
      checkinShown = true;
      const msgEl = document.getElementById("focusCheckinMsg");
      if(msgEl) msgEl.textContent = CHECKINS[Math.floor(Math.random()*CHECKINS.length)];
    }
    if(remain<=0){ clearInterval(focusTimer); toast("Session time's up! Tap Finish Now."); }
  }
  tick();
  focusTimer = setInterval(tick, 1000);
}
